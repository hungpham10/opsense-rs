[attributes]
prom_url = "https://prometheus.demo.prometheus.io"

[capacity]
up = 1.0

[[pipeline.components]]
type = "clock_source"
id = "clock"
interval_secs = 30

[[pipeline.components]]
type = "http_source"
id = "prom-explore"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/query_range"
initial_lookback_secs = 900
timeout_secs = 30
station = true
items = "data.result[].values[]"

   [pipeline.components.fields]
   ts = { query = "0", cast_to = "i64" }
   value = { query = "1", cast_to = "f64" }
   labels = { query = "^.^.metric" }

   [pipeline.components.constants]
   metric_id = "up"
   labels = { source = "prometheus-demo" }

   [pipeline.components.params]
   query = "up"
   start = "{{from_ts}}"
   end = "{{to_ts}}"
   step = "60"

[[pipeline.components]]
type = "http_source"
id = "metric-catalog"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/label/__name__/values"
station_kind = "category"
bind = "127.0.0.1:9290"
timeout_secs = 30
items = "data[]"

   [pipeline.components.fields]
   metric_id = { query = "." }
   [pipeline.components.constants]
   value = 0

[[pipeline.components]]
type = "category_station_transform"
id = "instance-catalog"
inputs = ["prom-explore"]
key_field = "instance"

[[pipeline.components]]
type = "category_station_transform"
id = "container-catalog"
inputs = ["prom-explore"]
key_field = "job"

[[pipeline.components]]
type = "http_source"
id = "disk-usage"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/query_range"
   initial_lookback_secs = 259200
   timeout_secs = 30
   station = true
   items = "data.result[].values[]"

   [pipeline.components.params]
   query = "100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes)"
   start = "{{from_ts}}"
   end = "{{to_ts}}"
   step = "60"

   [pipeline.components.fields]
   ts = { query = "0", cast_to = "i64" }
   value = { query = "1", cast_to = "f64" }
   labels = { query = "^.^.metric" }
   metric_id = { query = "^.^.metric.mountpoint" }

[[pipeline.components]]
type = "category_station_transform"
id = "disk-catalog"
inputs = ["disk-usage"]
key_field = "mountpoint"

[[pipeline.components]]
type = "rhai_transform"
id = "disk-grid"
inputs = ["disk-usage"]
script_path = "/Users/lap02921/Desktop/Workspace/opsense-rs/examples/prometheus-demo/rhai/disk_grid_report.rhai"
input_stage = "Processed"

   [pipeline.components.params]
   cells = 10
   recent_secs = 259200

[[pipeline.components]]
type = "pattern_station_transform"
id = "log-pattern"
inputs = ["prom-explore"]
text_field = "metric_id"
patterns = ["up", "scrape", "prometheus"]

[[pipeline.components]]
type = "null"
id = "null"
inputs = ["prom-explore", "metric-catalog", "instance-catalog", "container-catalog", "disk-usage", "disk-catalog", "disk-grid", "log-pattern"]
