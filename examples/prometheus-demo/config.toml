# Prometheus demo — chạy được ngay với `opsense serve`.
#
#   opsense validate --config examples/prometheus-demo/config.toml
#   OPSENSE_CONFIG=examples/prometheus-demo/config.toml opsense serve
#
# Storage `memory` + không khai S3 ⇒ không cần Postgres, RustFS hay MinIO để thử
# (muốn xem parquet/S3 thì copy `strategies/prometheus/config.toml` — đó là bản
# đầy đủ, CI chạy thật với `[[pipeline.components]]` giống hệt file này).
#
# Data thật từ https://prometheus.demo.prometheus.io (endpoint demo công khai).
# Endpoint demo trả **Prometheus JSON**, không phải mảng observations, nên
# `prom-explore` sẽ log warn khi parse — đó là hành vi đã biết, không phải lỗi
# config. Bản CI (`strategies/prometheus/config.toml`) re-point `url` về mock
# observations array để assert end-to-end.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "memory"

[attributes]
prom_url = "https://prometheus.demo.prometheus.io"

[capacity]
up = 1.0
node_memory_MemAvailable_bytes = 16.0

# ── 1. Nguồn: nhịp 10s ────────────────────────────────────────────────────────
[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

# ── 2. Nguồn: HTTP kéo số liệu từ Prometheus demo ───────────────────────────
# `station = true` ⇒ node này tự đăng ký station `prom-explore`, ai cũng query
# được; bỏ nó thì node chỉ đẩy xuống node downstream.
[[pipeline.components]]
type = "http_source"
id = "prom-explore"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/query_range?query=up"
interval_secs = 10
timeout_secs = 5
station = true

# ── 3. Transform: script Rhai ────────────────────────────────────────────────
# Script nhận mảng observation, trả mảng observation. File .rhai được compile
# 1 lần rồi cache theo mtime — sửa file là lần batch sau dùng bản mới.
[[pipeline.components]]
type = "rhai_transform"
id = "stats-summary"
inputs = ["prom-explore"]
script_path = "strategies/prometheus/script.rhai"

# ── 4. Sink: ghi ra station (đọc lại được qua MCP/CLI/REPL) ──────────────────
[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["stats-summary"]

# ── 5. Script inline (không cần file .rhai) ─────────────────────────────────
# Nhân `value` với `param_multiplier` — minh hoạ cách truyền `params` vào script.
[[pipeline.components]]
type = "rhai_transform"
id = "inline-example"
inputs = ["prom-explore"]
script = '''
fn process(observations) {
    if observations.len() == 0 { return []; }
    let multiplier = param_multiplier;
    if multiplier == 0.0 { multiplier = 2.0; }
    let out = [];
    for obs in observations {
        out.push(#{
            ts: obs.ts,
            metric_id: obs.metric_id,
            kind: obs.kind,
            signal: obs.signal,
            value: obs.value * multiplier,
            labels: obs.labels
        });
    }
    out
}
'''

  [pipeline.components.params]
  multiplier = 2.5

# ── 6. Node lá: nhận nhiều input mà không xử lý gì ──────────────────────────
# Bắt buộc cho transform non-sink: phải có consumer, nếu không runtime báo
# lỗi topo.
[[pipeline.components]]
type = "null"
id = "null"
inputs = ["prom-explore", "stats-summary", "inline-example"]
