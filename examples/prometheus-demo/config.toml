# Test http_source với Prometheus demo — chạy riêng, không đụng config.toml
[attributes]
prom_url = "https://prometheus.demo.prometheus.io"

[capacity]
up = 1.0

[[pipeline.components]]
type = "clock_source"
id = "clock"
interval_secs = 30

[[pipeline.components]]
type = "http_source"
id = "prom-explore"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/query_range"
initial_lookback_secs = 900
timeout_secs = 30
station = true
items = "data.result[].values[]"

   [pipeline.components.fields]
   ts = { query = "0", cast_to = "i64" }
   value = { query = "1", cast_to = "f64" }
   # `^` climb từ item [ts, value] qua mảng `values` về series cha để lấy labels
   labels = { query = "^.^.metric" }
   
   [pipeline.components.constants]
   metric_id = "up"
   labels = { source = "prometheus-demo" }

   [pipeline.components.params]
   query = "up"
   start = "{{from_ts}}"
   end = "{{to_ts}}"
   step = "60"

# Catalog metric name từ Prometheus demo.
[[pipeline.components]]
type = "http_source"
id = "metric-catalog"
inputs = ["clock"]
url = "{{prom_url}}/api/v1/label/__name__/values"
station_kind = "category"
bind = "127.0.0.1:9290"
timeout_secs = 30
items = "data[]"

   [pipeline.components.fields]
   metric_id = { query = "." }
   [pipeline.components.constants]
   value = 0

# Catalog instance/container: category_station_transform bóc label từ
# observations của prom-explore (labels lấy bằng jq `^` ở trên).
# Prometheus demo không có label `container` nên container-catalog dùng `job`.
[[pipeline.components]]
type = "category_station_transform"
id = "instance-catalog"
inputs = ["prom-explore"]
key_field = "instance"

[[pipeline.components]]
type = "category_station_transform"
id = "container-catalog"
inputs = ["prom-explore"]
key_field = "job"

[[pipeline.components]]
type = "null"
id = "null"
inputs = ["prom-explore", "metric-catalog", "instance-catalog", "container-catalog"]
