name: opsense

# Docker Compose v2 stack for local dev.
#
# Bring up the whole stack with:
#   docker compose up -d
#
# Services:
#   - postgres    : primary persistence (postgres:16-alpine)
#   - valkey      : cache layer (valkey 7-alpine)
#   - runner*     : 3 image variants of the analysis runner (echo/python/julia)
#   - opsense-serve: the main HTTP/gRPC server (opsense + nginx + alloy under supervisor)
#
# The Opsense images are built locally with `earthly +integration-images`,
# then `docker compose up`. See Makefile shortcuts.

services:
  postgres:
    image: postgres:16-alpine
    container_name: opsense-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: opsense
      POSTGRES_USER: opsense
      POSTGRES_PASSWORD: opsense123
    # Mount depth=1 schema files only — Postgres initdb runs every *.sql
    # in this directory at first boot. Env-specific seeds (depth=2) are
    # mounted into opsense-serve and run by scripts/release.sh.
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsense -d opsense"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [opsense-net]

  valkey:
    image: valkey/valkey:9-alpine
    container_name: opsense-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [opsense-net]

  # Dex OIDC provider (integration test only).
  # Image: ghcr.io/dexidp/dex:v2.41.1
  # Config: conf/dex/config.dev.yaml (static client + static user).
  # Exposed port 5556 for host-side OIDC discovery debug.
  opsense-dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: opsense-dex
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./conf/dex/config.dev.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5556/dex/.well-known/openid-configuration | grep -q issuer || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # opsense-runner (echo) — bare Tầng 2 runner with no kernel deps.
  # Referenced by opsense-serve via OPSENSE_RUNNER_GRPC=opsense-runner:50051.
  # Required for `docker compose up opsense-serve` end-to-end smoke (was missing
  # in earlier compose revisions; PLAN.MD §10.5 known gap).
  opsense-runner:
    image: ${OPSENSE_RUNNER_IMAGE:-opsense-runner:${OPSENSE_TAG:-local}}
    container_name: opsense-runner
    ports:
      - "50051:50051"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "/app/opsense runner --health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  opsense-runner-python:
    image: ${OPSENSE_RUNNER_PY_IMAGE:-opsense-runner-python:${OPSENSE_TAG:-local}}
    container_name: opsense-runner-python
    ports:
      - "50052:50051"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "/app/opsense runner --health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  opsense-runner-julia:
    image: ${OPSENSE_RUNNER_JL_IMAGE:-opsense-runner-julia:${OPSENSE_TAG:-local}}
    container_name: opsense-runner-julia
    ports:
      - "50053:50051"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "/app/opsense runner --health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  opsense-serve:
    image: ${OPSENSE_SERVE_IMAGE:-opsense-serve:${OPSENSE_TAG:-local}}
    container_name: opsense-serve
    ports:
      - "8080:8080"
    volumes:
      - ./env/secrets.dev.enc.yaml:/app/secrets/secrets.dev.enc.yaml:ro
      - ./conf/opsense.conf.toml:/app/opsense.conf.toml:ro
      # Mount the whole sql tree so release.sh can run schema (depth=1) then
      # the env-specific seed (depth=2) at boot.
      - ./sql:/app/sql:ro
      # Dex OIDC config (mounted into image for consistency with compose service).
      - ./conf/dex/config.dev.yaml:/etc/dex/config.dev.yaml:ro
    environment:
      # App
      APP_ENV: ${APP_ENV:-dev}
      ENCRYPTED_FILE: /app/secrets/secrets.${APP_ENV:-dev}.enc.yaml
      OPSENSE_CONFIG: /app/opsense.conf.toml
      DB_DSN: postgres://opsense:opsense123@opsense-postgres:5432/opsense
      SQL_BASE: /app/sql
      RUST_LOG: info
      # Symmetric key for AES-256-GCM encrypt/decrypt of secrets stored in
      # `sys_token_map.token` (oidc_client_secret, session_secret, …).
      # MUST match the key used to encrypt the blobs in
      # sql/postgres/dev/50-init-tenant.sql (32 ASCII bytes, dev only).
      MASTER_KEY: "0123456789abcdef0123456789abcdef"
      # Database init (release.sh prepare)
      POSTGRES_HOST: opsense-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: opsense
      POSTGRES_PASSWORD: opsense123
      POSTGRES_DATABASE: opsense
      # Runner discovery
      OPSENSE_RUNNER_GRPC: opsense-runner:50051
      # S3/object-store creds — strategy config như prometheus không hardcode key;
      # `opsense serve` fallback theo env (opsense-core station.rs open_backend)
      # nên mirror parquet → S3 hoạt động với MinIO mặc định.
      OPSENSE_S3_ACCESS_KEY_ID: ${OPSENSE_S3_ACCESS_KEY_ID:-opsense}
      OPSENSE_S3_SECRET_ACCESS_KEY: ${OPSENSE_S3_SECRET_ACCESS_KEY:-opsense123}
      # Nginx / supervisor boot (release.sh sed)
      NGINX_DIR: /usr/local/openresty/nginx/conf
      NGINX_LOG: main
      HTTP_SERVER: localhost
      ENVIRONMENT: dev
      USE_TOR: "false"
      # Alloy metrics
      USE_ALLOY: "false"
      # Redis (valkey)
      REDIS_HOST: opsense-valkey
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      opsense-dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [opsense-net]

  # MinIO — object store S3-compatible cho lakehouse parquet (local dev).
  # Endpoint: http://minio:9000 (path-style, OPSENSE_S3_ENDPOINT).
  # Bucket `opsense-lake` được tạo tự động bởi minio-bucket service.
  minio:
    # Use quay.io to avoid Docker Hub rate limits
    image: quay.io/minio/minio:latest
    container_name: opsense-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${OPSENSE_S3_ACCESS_KEY_ID:-opsense}
      MINIO_ROOT_PASSWORD: ${OPSENSE_S3_SECRET_ACCESS_KEY:-opsense123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [opsense-net]

  # Tạo bucket opsense-lake trên MinIO ngay khi MinIO sẵn sàng.
  # Run as init container that stays alive; healthcheck passes after bucket creation.
  minio-bucket:
    # Use quay.io to avoid Docker Hub rate limits
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set myminio http://minio:9000 opsense opsense123 &&
      mc mb --ignore-existing myminio/opsense-lake &&
      mc ls myminio/opsense-lake &&
      touch /tmp/bucket-ready &&
      echo 'Bucket ready, keeping container alive...' &&
      sleep infinity"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bucket-ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

networks:
  opsense-net:
    driver: bridge

volumes:
  minio-data:
