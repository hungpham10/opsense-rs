# Opsense configuration generated by `opsense init`.
#
# Quick tour:
#   1. Set [attributes] (template variables) and [capacity].
#   2. Uncomment ONE of the [pipeline] blocks below — or leave [pipeline]
#      out entirely for the default minimal graph: `clock -> null`.
#   3a. Interactive: `opsense serve --repl` (analysis REPL + Python), or
#       `opsense serve --mcp` / `opsense mcp` (headless MCP stdio) /
#       `opsense serve --mcp --http` (remote MCP clients; combinable
#       with `--repl`). From your MCP client call opsense_init /
#       opsense_run / opsense_status / opsense_query / opsense_edit.
#   3b. Gateway:     OPSENSE_CONFIG=<this file> opsense serve

[engine]
poll_interval_seconds = 3600
cache_block_seconds = 300
cache_max_blocks = 288
# Interpreter used by analysis sessions (`opsense serve --repl`).
# Empty = auto-detect `python3`. Packages missing at startup warn only —
# they fail when a specific analysis actually imports them.
python_path = ""
python_packages = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "sklearn",
    "statsmodels",
    "matplotlib",
]

# Interactive analysis sessions (`opsense serve --repl`, MCP session tools).
[session]
max_memory_mb = 2048              # RLIMIT_AS cap for the Python sandbox
max_cpu_time_secs = 300
max_execution_time_secs = 60      # per-command budget
max_result_rows = 1000000         # query results above this are refused
idle_timeout_secs = 1800          # sessions idle this long are closed
allow_fs = false                  # Python: filesystem access off by default
allow_net = false                 # Python: network access off by default

# REPL shell behaviour (`opsense serve --repl`).
[repl]
history_file = "~/.opsense/history.txt"
max_history = 10000
completion = true
default_station = ""              # station pre-selected on startup

# metric name -> maximum capacity (cores, GB, req/s, ...) for later analysis.
[capacity]
cpu = 8.0
mem = 16.0

# Template variables usable as {{name}} inside http_source
# url/headers/body. Override per environment WITHOUT editing this
# file: OPSENSE_ATTR_<NAME> (uppercase) wins, env-only entries are picked
# up too — put secrets there, not here.
[attributes]
prom_url = "http://127.0.0.1:9090"    # TODO: URL Prometheus/VictoriaMetrics của bạn

# Durable backend: "parquet" (canonical), "memory" (mặc định) hoặc "sqlite".
#   - parquet: lake Parquet time-partitioned — mỗi station một thư mục
#            <data_dir>/<id>-<kind>/ chứa: wal.log (mutation log kiểu Delta),
#            tables/*.parquet + _current (checkpoint state, atomic), và
#            ts/blk=<block_id>/batch-<millis>.parquet (timeseries cắt theo
#            block thời gian; block_id = floor(ts / block_secs)). Các hệ thống
#            data processing (Spark/DuckDB/Polars) đọc thẳng ts/blk=*/*.parquet.
#   - memory:  không persistence — chỉ LRU in-memory.
#   - sqlite:  một file riêng cho mỗi station.
# Mirror lên object store (lakehouse S3):
#   - Cách 1 (khuyến nghị): khai [storage.s3] bên dưới với bucket + prefix →
#     lake xuất ra s3://<bucket>/<prefix>/<id>/ts/blk=*/*.parquet (+ state/),
#     tự flush/snapshot định kỳ theo s3_flush_interval_secs / s3_snapshot_interval_secs.
#   - Cách 2: data_dir = "s3://bucket/prefix" → lấy credentials từ env
#     AWS_* / OPSENSE_S3_* (OPSENSE_S3_ENDPOINT cho object store self-hosted).
# (Tên cũ "duckdb"/"lakehouse"/"s3" không còn được khuyến nghị dùng — code
# chỉ nhận chúng làm alias deprecated cho "parquet".)
# block_secs: độ rộng mỗi block parquet (giây) = partition blk=; mặc định 3600.
# retention_secs > 0: mỗi phút xoá điểm cũ hơn N giây (parquet: nguyên blk partition).
# parquet_compression: "zstd" (mặc định) | "snappy" | "gzip" | "uncompressed".
[storage]
backend = "parquet"
data_dir = ".opsense/parquet"        # local cache root (data vẫn nằm trong
                                     # <data_dir>/<id>-timeseries/ts/...)
# block_secs = 3600
# retention_secs = 7776000           # ví dụ: chỉ giữ 90 ngày (0/bỏ = giữ mãi)
# parquet_compression = "zstd"
# [storage.s3]                        # (tùy chọn) mirror parquet lên S3 → nơi
# bucket = "opsense-lake"            # Spark/DuckDB/Polars query trực tiếp qua
# prefix = "prod"                    # s3://opsense-lake/prod/<id>/ts/**/*.parquet
# endpoint = "http://rustfs:9000"     # bỏ trống = AWS public; /region, /access_key_id,
# url_style = "path"                 # /secret_access_key nhận env OPSENSE_S3_*.
# s3_flush_interval_secs = 60        # flush timeseries ra S3 theo lịch
# s3_snapshot_interval_secs = 600    # checkpoint + mirror state lên S3 theo lịch

# Cursor pipeline tự lưu <data_dir>/watermarks.json để restart tiếp tục chỗ cũ.

# ------------------------------------------------------------------
# A) Playground — NO clock: trigger manually with MCP `opsense_run`,
#    read results back with `opsense_query`. See scripts/README.md.
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "input"                        # node nạp dữ liệu bằng tay qua opsense_run
# id = "ingest"
#
# [[pipeline.components]]
# type = "rhai_transform"
# id = "mean"
# inputs = ["ingest"]
# script_path = "scripts/moving_avg.rhai"
#
# [[pipeline.components]]
# type = "timeseries_station_sink"
# id = "mean-station"
# inputs = ["mean"]

# ------------------------------------------------------------------
# B) VictoriaMetrics / Prometheus — the generic HTTP node.
#    Every minute the window advances: `bindings` computes from/to (giây)
#    từ ts()/interval(); http_source gọi url mỗi chu kỳ và lưu vào station.
#    http_source chỉ hỗ trợ JSON Observation (mảng/object đơn); không có
#    jq extraction (items/fields/constants/params) hay bind.
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "clock"
# id = "clock"
# interval_secs = 60
#
# [[pipeline.components]]
# type = "http_source"
# id = "prom"
# inputs = ["clock"]
# url = "{{prom_url}}/api/v1/query_range?query=up&start={{from}}&end={{to}}&step=120"
# timeout_secs = 120
# station = true                       # publish a station under id "prom"
# bindings = {                         # bindings cho {{name}} template trong url
#   from = "sub_secs(ts(), interval())",
#   to   = "ts()",
# }

# ------------------------------------------------------------------
# C) Trạm timeseries nội bộ — mỗi sink ghi vào station riêng theo id của nó;
#    persistence/nén nằm ở [storage] trên (Parquet). Đọc lại qua REPL/MCP/HTTP
#    hoặc một http_source trỏ ngược về endpoint Prometheus-style của trạm.
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "timeseries_station_sink"
# id = "tsdb"
# inputs = ["prom"]
#
# Đọc lịch sử từ trạm qua http_source (query nhét thẳng vào url):
# [[pipeline.components]]
# type = "http_source"
# id = "history"
# inputs = ["clock"]
# url = "http://127.0.0.1:9190/api/v1/query_range?query=cpu_usage&start={{from}}&end={{to}}"
# bindings = {
#   from = "sub_secs(ts(), interval())",
#   to   = "ts()",
# }

