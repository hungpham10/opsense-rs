# Opsense configuration generated by `opsense init`.
#
# Quick tour:
#   1. Set [attributes] (template variables) and [capacity].
#   2. Uncomment ONE of the [pipeline] blocks below — or leave [pipeline]
#      out entirely for the default hourly graph:
#      clock_source -> ingest_source -> processor_transform -> persist_sink
#   3a. Interactive: `opsense serve --repl` (analysis REPL + Python), or
#       `opsense serve --mcp` / `opsense mcp` (headless MCP stdio) /
#       `opsense serve --mcp --http` (remote MCP clients; combinable
#       with `--repl`). From your MCP client call opsense_init /
#       opsense_run / opsense_status / opsense_query / opsense_edit.
#   3b. Gateway:     OPSENSE_CONFIG=<this file> opsense serve

[engine]
poll_interval_seconds = 3600
cache_block_seconds = 300
cache_max_blocks = 288
# Interpreter used by analysis sessions (`opsense serve --repl`).
# Empty = auto-detect `python3`. Packages missing at startup warn only —
# they fail when a specific analysis actually imports them.
python_path = ""
python_packages = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "sklearn",
    "statsmodels",
    "matplotlib",
]

# Interactive analysis sessions (`opsense serve --repl`, MCP session tools).
[session]
max_memory_mb = 2048              # RLIMIT_AS cap for the Python sandbox
max_cpu_time_secs = 300
max_execution_time_secs = 60      # per-command budget
max_result_rows = 1000000         # query results above this are refused
idle_timeout_secs = 1800          # sessions idle this long are closed
allow_fs = false                  # Python: filesystem access off by default
allow_net = false                 # Python: network access off by default

# REPL shell behaviour (`opsense serve --repl`).
[repl]
history_file = "~/.opsense/history.txt"
max_history = 10000
completion = true
default_station = ""              # station pre-selected on startup

# metric name -> maximum capacity (cores, GB, req/s, ...) for later analysis.
[capacity]
cpu = 8.0
mem = 16.0

# Template variables usable as {{name}} inside http_source
# url/headers/params/body. Override per environment WITHOUT editing this
# file: OPSENSE_ATTR_<NAME> (uppercase) wins, env-only entries are picked
# up too — put secrets there, not here.
[attributes]
prom_url = "http://127.0.0.1:9090"    # TODO: URL Prometheus/VictoriaMetrics của bạn

# Durable backend: "duckdb" (parquet lakehouse), "lmdb", "memory" hoặc "s3".
#   - duckdb: ghi parquet ra <data_dir>/<stage>/blk=<start>/batch_NNN.parquet
#            (layout cũ dt=YYYY-MM-DD/hour=HH/... vẫn đọc được — read-compat).
#   - s3:    data_dir dạng "s3://bucket/prefix"; credentials + region lấy từ
#            env qua AmazonS3Builder::from_env(), OPSENSE_S3_ENDPOINT cho MinIO.
# Query lakehouse chỉ mở đúng block cắt ngang cửa sổ (block pruning).
# block_secs: độ rộng mỗi block parquet (giây). Mặc định 3600.
# retention_secs > 0: mỗi phút xoá điểm cũ hơn N giây (lakehouse: nguyên block).
[storage]
backend = "duckdb"
data_dir = ".opsense/lakehouse"
# block_secs = 3600
# retention_secs = 7776000               # ví dụ: chỉ giữ 90 ngày (0/bỏ = giữ mãi)
# Ví dụ S3: backend = "s3", data_dir = "s3://my-bucket/opsense"

# Cursor pipeline tự lưu <data_dir>/watermarks.json để restart tiếp tục chỗ cũ.

# ------------------------------------------------------------------
# A) Playground — NO clock: trigger manually with MCP `opsense_run`,
#    read results back with `opsense_query`. See scripts/README.md.
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "ingest_source"
# id = "ingest"
#
# [[pipeline.components]]
# type = "rhai_transform"
# id = "mean"
# inputs = ["ingest"]
# script_path = "scripts/moving_avg.rhai"
#
# [[pipeline.components]]
# type = "timeseries_station_sink"
# id = "mean-station"
# inputs = ["mean"]
# # bind = "127.0.0.1:9190"            # mở endpoint Prometheus-style

# ------------------------------------------------------------------
# B) VictoriaMetrics / Prometheus through the generic HTTP node.
#    Every minute the window advances (cursor -> ts): the request only
#    asks for the delta. First cycle backfills initial_lookback_secs.
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "clock_source"
# id = "clock"
# interval_secs = 60
#
# [[pipeline.components]]
# type = "http_source"
# id = "prom"
# inputs = ["clock"]
# url = "{{prom_url}}/api/v1/query_range"
# initial_lookback_secs = 900          # first cycle backfills 15 minutes
# timeout_secs = 120
# station = true                       # publish a station under id "prom"
# # bind = "127.0.0.1:9290"            # optional Prometheus-style endpoint
#
# # Declarative jq extraction: walk down to each sample, pick ts/value out of
# # the [ts, "val"] pair, then stamp a fixed metric id + labels on every obs.
# items = "data.result[].values[]"
# [pipeline.components.fields]
# ts = { query = "0", cast_to = "i64" }
# value = { query = "1", cast_to = "f64" }
# [pipeline.components.constants]
# metric_id = "up"
# labels = { job = "node_exporter" }
#
# [pipeline.components.params]         # keys literal, values are templates
# query = "up"                         # any PromQL — try up{job="node_exporter"}
# start = "{{from_ts}}"
# end = "{{to_ts}}"
# step = "120"
#
# [[pipeline.components]]
# type = "timeseries_station_sink"
# id = "prom-station"
# inputs = ["prom"]

# ------------------------------------------------------------------
# C) Trạm timeseries nội bộ — cache khối (dọn khi đầy: số entry + dung lượng),
#    cold tier LMDB tuỳ chọn. Một node http_source khác có thể trỏ về chính
#    trạm này thay vì Prometheus. Script Rhai trong pipeline cũng gọi được
#    ts_query()/ts_mean().
# ------------------------------------------------------------------
# [[pipeline.components]]
# type = "timeseries_station_sink"
# id = "tsdb"
# inputs = ["processor"]
# bind = "127.0.0.1:9190"
# block_secs = 300                      # độ rộng block LRU
# max_hot_blocks = 288                  # trần số entry
# max_hot_mb = 256                      # trần dung lượng RAM (xấp xỉ)
# data_dir = ""                         # để trống = chỉ RAM (cold LMDB optional)
# cold_retention_secs = 604800          # xoá điểm LMDB cũ hơn 7 ngày (0 = giữ)
#
# Đọc lại lịch sử từ trạm qua http_source (query nhét thẳng vào URL):
# [[pipeline.components]]
# type = "http_source"
# id = "history"
# inputs = ["clock"]
# url = "http://127.0.0.1:9190/api/v1/query_range?query=cpu_usage&start={{from_ts}}&end={{to_ts}}"
# fields.value = { query = "value", cast_to = "f64" }

