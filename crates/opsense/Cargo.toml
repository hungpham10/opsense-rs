[package]
name = "opsense"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Centralize site reliability engineer's daily activities"

[lints.rust]
warnings = "deny"

[[bin]]
name = "opsense"
path = "src/main.rs"

[dependencies]
# CLI / runtime
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
tokio = { workspace = true }

# Error handling
anyhow = "1"

# HTTP + GraphQL API
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-macros = "0.5"
axum-extra = { version = "0.10", features = ["typed-header"] }
axum-prometheus = "0.10"
headers = "0.4"
http = "1"
tower-http = { version = "0.6", features = ["trace"] }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
reqwest = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32" }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Admin / auth helpers
chrono = { version = "0.4", features = ["serde"] }
aws-sdk-s3 = "1.122.0"
# Raw SQL (OAuth token revocation) against the resolver's AnyPool.
sqlx = { workspace = true }

# MCP stdio server (protocol 2024-11-05). `=0.8.0` matches the handler/tool
# macro API the mcp module was written against; `transport-io` adds stdio.
rmcp = { version = "=0.8.0", features = ["transport-io"] }

# Workspace crates
opsense-model = { path = "../opsense-model" }
opsense-core = { path = "../opsense-core" }
# `json` links qlib's typetag-registered pipeline components (Calendar, grid
# strategies, …) into the component inventory deserialized from pipeline TOML.
opsense-qlib = { path = "../opsense-qlib", features = ["json"] }
# `json` enables the `vector` data-pipeline subsystem (sources/transforms/
# sinks) that AppState builds the runtime from.
opsense-mlib = { path = "../opsense-mlib", features = ["json"] }

# gRPC kernel runner client (`client::grpc::RunnerClient` + the `repl`
# subcommand's `--runner` mode, and the `runner` subcommand's standalone
# gRPC service).
opsense-proto = { path = "../opsense-proto" }
opsense-runner = { path = "../opsense-runner" }
tonic = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

# REPL (`opsense repl` subcommand)
reedline = { workspace = true }
comfy-table = { workspace = true }
# Kernel `:export` path: DataFrame → .parquet / .csv
arrow-ipc = { workspace = true }
arrow-csv = { workspace = true }
parquet = { workspace = true }

[features]
# Unit tests in `client/grpc.rs` spin up an in-process gRPC runner via the
# `opsense_runner` crate. The crate is now a regular dependency, so enabling
# this feature compiles those tests. They additionally need the echo kernel
# binary built (`cargo build -p opsense-kernel-echo`) — off by default, with
# end-to-end coverage in `tests/integration_runner_grpc.rs`.
internal-runner-tests = []

# Tests under `crates/opsense/tests/` — run against the docker-compose stack
# (see `.github/workflows/ci.yml`); they skip gracefully when the stack is
# down (`OPSENSE_INTEGRATION` unset).
[dev-dependencies]
opsense-mlib = { path = "../opsense-mlib", features = ["json", "parquet"] }
opsense-components = { path = "../opsense-components" }
object_store = { workspace = true }
tempfile = "3"
futures-util = { workspace = true }
rexpect = "0.5"
nix = "0.25"
jsonwebtoken = "9"
uuid = { workspace = true }