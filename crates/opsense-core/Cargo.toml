[package]
name = "opsense-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[features]
default = []
arrow = ["dep:arrow"]
arrow-deps = ["arrow"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
config_crate = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
tokio = { workspace = true }
async-trait = { workspace = true }
async-graphql = { workspace = true }
opsense-libs = { path = "../opsense-libs" }
opsense-model = { path = "../opsense-model" }
reqwest = { workspace = true, features = ["json", "rustls"] }
tracing = { workspace = true }

# Store backends (only what remains after the "station is the only cache"
# refactor: bounded in-memory LRU via opsense-libs; no duckdb/lmdb/arrow lake).
futures = { workspace = true }
chrono = { workspace = true }
arrow = { workspace = true, optional = true }
