[package]
name = "opsense-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[features]
default = []
# Forwards the optional opsense-mlib persistence backends so `cfg(feature)`
# works inside this crate. `parquet` maps to the Parquet storage (canonical
# backend name là "parquet"); `sqlite` maps to a local SQLite file; `redis` maps
# to the Redis/Valkey storage. "memory" needs no feature.
parquet = ["opsense-mlib/parquet"]
sqlite = ["opsense-mlib/sqlite"]
redis = ["opsense-mlib/redis"]

# Arena LRU dùng chung giữa các shard, thay cho chia cứng.
#
# Bản mặc định của `opsense-mlib` cắt arena thành `S` khối × `ceil(capacity / S)`
# node với ranh giới **đóng dấu lúc dựng**: shard tràn không mượn được node của
# shard đang trống, nên `capacity` mất ý nghĩa tổng và mất dữ liệu khi
# `capacity_per_shard == 1`. Đo được trên `TimeseriesStation`: nạp 29 block với
# `capacity = 32, S = 32` chỉ còn 18; `capacity = 2000, n = 2000` vẫn mất 102.
#
# Bật feature này thì arena là **một** khối `capacity` node trong free-list chung,
# nên `capacity` là sức chứa tổng thật. Bật ở `image.yml` cùng `parquet`.
lru-shared-memory = ["opsense-mlib/lru-shared-memory"]

[dependencies]
opsense-mlib = { path = "../opsense-mlib", features = ["json"] }
opsense-model = { path = "../opsense-model" }
# `json` exposes the qlib `DataLoader` trait; the timeseries station
# implements it (via `TimeseriesStationHandle`) so stations can be read back
# as candles by scripts and the trading domain.
opsense-qlib = { path = "../opsense-qlib", features = ["json"] }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `tracing::warn!` khi query bị cắt cửa sổ — xem `MAX_BLOCKS_PER_QUERY` trong
# `src/station.rs`. Không log thì việc cắt là thụ động, người đọc tưởng mất dữ
# liệu chứ không phải bị giới hạn.
tracing = { workspace = true }

config_crate = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
tokio = { workspace = true }
async-graphql = { workspace = true }

# Dựng `redis::Client` cho backend `"redis"` trong `src/station.rs`. Optional,
# bật cùng feature `redis` (xem [features] trên).
redis = { workspace = true, optional = true }

# Store backends are optional and feature-forwarded from opsense-mlib (see
# [features] above): "memory" uses only the bounded in-memory LRU; "parquet"
# uses Parquet storage; "sqlite" uses one file per station; "redis" uses a
# Redis/Valkey server.
