[package]
name = "opsense-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
futures = "0.3"
async-trait = "0.1"
axum = { workspace = true }
opsense-core = { path = "../opsense-core" }
opsense-libs = { path = "../opsense-libs" }
opsense-macros = { path = "../opsense-macros" }
opsense-model = { path = "../opsense-model" }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
tracing = "0.1"
typetag = "0.2"

[features]
default = []
sqlite = ["opsense-libs/sqlite"]
redis = ["opsense-libs/redis"]
