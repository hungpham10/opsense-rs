[package]
name = "opsense-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
futures = { workspace = true }
async-trait = { workspace = true }
opsense-core = { path = "../opsense-core" }
# Aliased to `opsense-mlib` (formerly `opsense-libs`): all `opsense_libs::`
# paths in this crate keep working through the alias. `json` enables the
# vector / jq / search subsystems the components build on.
opsense-libs = { package = "opsense-mlib", path = "../opsense-mlib", features = ["json"] }
opsense-macros = { path = "../opsense-macros" }
# `json` links qlib's typetag-registered pipeline components
# (Calendar, grid strategies, StreamingPortfolio, …) into the inventory that
# opsense-components deserializes from pipeline TOML / registers with typetag.
opsense-qlib = { path = "../opsense-qlib", features = ["json"] }
opsense-model = { path = "../opsense-model" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
typetag = { workspace = true }

[features]
default = []
sqlite = ["opsense-libs/sqlite"]
redis = ["opsense-libs/redis"]
test-utils = []

[dev-dependencies]
opsense-model = { path = "../opsense-model" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
