[package]
name = "opsense-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Opsense FFI SDK — ABI-stable interface for dynamic API/MCP modules"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }

[features]
default = []
serde = []

[lib]
# Only rlib: this is the shared contract, not a plugin itself
crate-type = ["rlib"]