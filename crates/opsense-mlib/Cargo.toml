[package]
name = "opsense-mlib"
version.workspace = true
edition = "2024"
license.workspace = true

[lints.rust]
warnings = "deny"

[features]
default = []
bloom-search = []
sops = ["rand", "aes-gcm"]
json = []
rhai = ["dep:rhai"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet", "dep:object_store"]
sqlite = ["dep:sqlx"]
redis = ["dep:redis"]
# Cluster cho nhiều node, hai feature tách ràng. Cả hai đều tắt mặc định để
# crate nhẹ không bị kéo thêm; vận chuyển nằm ở `opsense::cluster`.
#   gossip = quan sát (ai sống) — không quyết định gì
#   raft   = quyết định (ai là master) — không suy đoán gì
gossip = []
raft = []

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

# sops (AES-GCM challenge encryption)
aes-gcm = { version = "0.10", optional = true }
rand = { workspace = true, optional = true }

# rhai scripting (optional)
rhai = { workspace = true, optional = true }

# --- vector subsystem ---
tokio = { workspace = true }
async-trait = { workspace = true }
typetag = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
log = { workspace = true }
opsense-macros = { path = "../opsense-macros" }
# `tls` — cài process-wide rustls crypto provider (xem `src/tls.rs`).
rustls = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Test mesh cần feature `cluster`; khai `required-features` để build không bật
# feature vẫn xanh thay vì hỏng vì không tìm thấy module.





# Test cluster cần feature tương ứng; `required-features` để build không bật
# feature vẫn xanh thay vì hỏng vì không tìm thấy module.
[[test]]
name = "gossip"
required-features = ["gossip"]

[[test]]
name = "raft"
required-features = ["raft"]
