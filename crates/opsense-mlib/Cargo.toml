[package]
name = "opsense-mlib"
version.workspace = true
edition = "2024"
license.workspace = true

[lints.rust]
warnings = "deny"

[features]
default = []
bloom-search = []
sops = ["rand", "aes-gcm"]
json = []
rhai = ["dep:rhai"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet", "dep:object_store"]
sqlite = ["dep:sqlx"]
redis = ["dep:redis"]
# Cluster cho nhiều node, hai feature tách ràng. Cả hai đều tắt mặc định để
# crate nhẹ không bị kéo thêm; vận chuyển nằm ở `opsense::cluster`.
#   gossip = quan sát (ai sống) — không quyết định gì
#   raft   = quyết định (ai là master) — không suy đoán gì
gossip = []
raft = []

# Arena LRU dùng chung giữa các shard, thay vì chia cứng.
#
# Mặc định `new()` cắt `Box<[Node]>` thành `S` khối × `ceil(capacity / S)` node,
# ranh giới khối **đóng dấu lúc dựng, không bao giờ dịch**. Shard tràn không
# mượn được node của shard đang trống, nên `capacity` mất hết ý nghĩa tổng và mất
# dữ liệu khi `capacity_per_shard == 1`:
#
#   cap=32,  S=32  →  29 key còn 18   (mất 11)
#   cap=2000, S=32  →  n=2000, còn 1898 (mất 102 — capacity ĐỦ vẫn mất)
#   cap=32,  S=1   →  29 key còn 29
#
# Bật feature này: **một** arena `capacity` node trong free-list chung (Treiber
# stack không khóa); shard nào cần thì pop node trống, hết thì mượn từ shard
# khác. `capacity` trở thành sức chứa tổng thật.
#
# Đánh đổi: `acquire_node` khi cache đầy phải khóa **hai** shard (shard đích và
# shard bị mượn) thay vì một, nên ghi dưới tải nặng chậm hơn bản chia shard. Bù lại
# không còn mất dữ liệu. Xem `cap_probe` trong test `lru.rs` để đo lại.
lru-shared-memory = []

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

# sops (AES-GCM challenge encryption)
aes-gcm = { version = "0.10", optional = true }
rand = { workspace = true, optional = true }

# rhai scripting (optional)
rhai = { workspace = true, optional = true }

# --- vector subsystem ---
tokio = { workspace = true }
async-trait = { workspace = true }
typetag = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
log = { workspace = true }
opsense-macros = { path = "../opsense-macros" }
# `tls` — cài process-wide rustls crypto provider (xem `src/tls.rs`).
rustls = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Test cluster cần feature tương ứng; `required-features` để build không bật
# feature vẫn xanh thay vì hỏng vì không tìm thấy module.
[[test]]
name = "gossip"
required-features = ["gossip"]

[[test]]
name = "raft"
required-features = ["raft"]
