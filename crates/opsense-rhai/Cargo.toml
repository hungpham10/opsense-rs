[package]
name = "opsense-rhai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
async-trait = { workspace = true }
inventory = "0.3"
opsense-core = { path = "../opsense-core" }
opsense-components = { path = "../opsense-components" }
opsense-mlib = { path = "../opsense-mlib", features = ["json", "rhai"] }
opsense-macros = { path = "../opsense-macros" }
opsense-model = { path = "../opsense-model" }
# `graph` = DAG genome → ONNX (ops/nodes tự emit protobuf, chạy bằng tract):
# cầu nối cho DAG model build riêng ở Python, dùng làm `strategy = "dag"` cho
# `portfolio_feed`. Ẩn dụng nó cũng bật `json` (typetag/serde cho `Graph`).
opsense-qlib = { path = "../opsense-qlib", features = ["json", "graph"] }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
typetag = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
