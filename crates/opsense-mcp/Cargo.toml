[package]
name = "opsense-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
axum = { workspace = true }
libc = "0.2"
opsense-core = { path = "../opsense-core" }
opsense-session = { path = "../opsense-session" }
opsense-components = { path = "../opsense-components" }
opsense-libs = { path = "../opsense-libs" }
opsense-rhai = { path = "../opsense-rhai" }
rmcp = { version = "3", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
