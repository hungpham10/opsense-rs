[package]
name = "opsense-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
opsense-mlib = { path = "../opsense-mlib", features = ["sops"] }

# Thời gian — dùng chung type với `session/store.rs` và các API layer.
chrono = { version = "0.4", features = ["serde"] }

# GraphQL — derive Enum/SimpleObject trên các type shared (TelemetryKind, Signal,
# LogLevel, Observation) để dùng trực tiếp ở `crates/opsense/src/api/repl/v1.rs`
# thay vì duplicate adapter.
async-graphql = { workspace = true }

# Trivial libraries
rand = "0.8.5"
sha2 = "0.10.9"
subtle = "2.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
async-trait = "0.1"
log = { workspace = true }

# JSON
serde = { workspace = true }
serde_json = { workspace = true }

# Integrate
redis = { workspace = true}
aws-sdk-s3 = "1.122.0"
aws-config = "1.8.13"
reqwest = { workspace = true }
sqlx = { workspace = true }
