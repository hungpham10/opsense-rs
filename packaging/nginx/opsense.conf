# opsense — reverse proxy site config.
#
# Cài vào /etc/nginx/sites-available/opsense.conf; postinstall tạo symlink
# trong sites-enabled. Đây là config cho **nginx của Ubuntu** (package
# `nginx`), khác với `conf/nginx/http.conf` trong repo — cái đó là openresty
# + lua-resty-openidc + `%%HTTP_SERVER%%` placeholder cho build Docker.
#
# ── Vì sao proxy qua Unix socket chứ không phải TCP ─────────────────────
# `serve` mặc định `GATEWAY_LISTENER=unix` và bind `/run/axum`
# (crates/opsense/src/serve.rs). Dùng socket thì app **không mở port nào** trên
# network ⇒ không cần `ListenAdress 0.0.0.0` trong systemd unit, và loopback
# không đi qua được nếu app chết. Đổi sang TCP thì xem `docs/DEPLOY.md`.
#
# `map` chỉ hợp lệ trong `http {}` — Ubuntu nạp `sites-enabled/*` **bên
# trong** `http {}` nên khai ở đây được. Phải tự khai vì `nginx` distro
# không có `$connection_upgrade` sẵn (repo có, trong `conf/nginx/http.conf`).

map $http_upgrade $opsense_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream opsense_backend {
    # `fail_timeout=0` + `keepalive` ⇒ nginx không cắt connection đang idle vì
    # coi upstream như "hỏng" sau 60s không có request. Ở đây upstream là Unix
    # socket nên mất kết nối = app restart, và mọi request sau đó sẽ fail cho
    # tới khi app bind lại.
    server unix:/run/axum fail_timeout=0;
    keepalive 32;
}

server {
    # `default_server` để đè site mặc định của Ubuntu. Nếu thích đặt domain
    # thật thì đổi thành `server_name ten.mien;` và bỏ `default_server`.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Truy cập nội bộ cũng qua proxy để không lộ port nào ra ngoài.
    access_log /var/log/nginx/opsense.access.log;
    error_log  /var/log/nginx/opsense.error.log;

    # Mặc định nginx chỉ 1m; script Rhai có thể POST payload lớn.
    client_max_body_size 32m;

    # Không cache gì: mọi response của opsense là JSON trạng thái sống.
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # WebSocket: `rhai_transform` / GraphQL subscription và node
    # `websocket_2_json` đều cần `Upgrade`. Timeout dài hơn mặc định 60s vì
    # stream aggTrade của Binance đứng yên giữa hai tick cũng phải giữ.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $opsense_connection_upgrade;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://opsense_backend;
    }

    # Health tách riêng để `curl` không phải đi qua proxy buffer.
    location = /health {
        proxy_pass http://opsense_backend;
        access_log off;
    }
}
