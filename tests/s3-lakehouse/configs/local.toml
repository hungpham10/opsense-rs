# Case 1: Local parquet storage — không S3. Pipeline clock → local-metrics → station.
# Mục đích: verify parquet lake time-partitioned chạy trên local, WAL + checkpoint.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300
# parquet_compression = "zstd"

[capacity]
cpu_usage = 4.0
mem_usage = 16.0
disk_usage = 1.0

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "http_source"
id = "local-metrics"
inputs = ["clock"]
url = "http://local-metrics:8080/metrics"
interval_secs = 10
timeout_secs = 10
station = true

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["local-metrics"]
