# Case: Memory storage — thuần RAM, không persistence.
# Mục đích: verify opsense khởi động với backend "memory", pipeline chạy,
# stations queryable qua REPL/MCP nhưng dữ liệu mất khi restart.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "memory"

[capacity]
cpu_usage = 4.0
mem_usage = 16.0
disk_usage = 1.0

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "http_source"
id = "mem-metrics"
inputs = ["clock"]
url = "http://local-metrics:8080/metrics"
interval_secs = 10
timeout_secs = 10
station = true

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["mem-metrics"]
