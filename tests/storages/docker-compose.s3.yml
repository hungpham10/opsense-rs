# Overlay cho S3 lakehouse — thêm Prometheus + node-exporter + metrics-adapter.
# Dùng kèm: docker compose -f docker-compose.yml -f tests/storages/docker-compose.s3.yml up -d --profile s3 --profile prometheus
#
# Hoặc: docker compose -f docker-compose.yml -f tests/storages/docker-compose.s3.yml --profile s3 --profile prometheus up -d

services:
  prometheus:
    profiles: [prometheus]
    image: prom/prometheus:latest
    container_name: opsense-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [opsense-net]

  node-exporter:
    profiles: [prometheus]
    image: prom/node-exporter:latest
    container_name: opsense-node-exporter
    ports:
      - "9100:9100"
    networks: [opsense-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9100/metrics || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  metrics-adapter:
    profiles: [prometheus]
    build:
      context: ./metrics-adapter
      dockerfile: Dockerfile
    container_name: opsense-metrics-adapter
    ports:
      - "8081:8080"
    environment:
      PROMETHEUS_URL: "http://prometheus:9090"
      PROMETHEUS_QUERIES: "up{job=\"prometheus\"},node_cpu_seconds_total{mode=\"idle\"},node_memory_MemAvailable_bytes"
      CACHE_TTL: "5"
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [opsense-net]

volumes:
  prometheus-data:
