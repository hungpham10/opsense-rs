name: push-image

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish, for example v1.0.0
        required: true
        default: v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: hungpham10/opsense

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build Binaries cho ca AMD64 & ARM64
  build:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Install system dependencies & zig
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler zig
          cargo install cargo-zigbuild --locked

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build cross-arch binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/opsense
            target/${{ matrix.target }}/release/opsense-kernel-echo
            target/${{ matrix.target }}/release/opsense-kernel-python
            target/${{ matrix.target }}/release/opsense-kernel-julia
          retention-days: 1

  # Job 2: Build & Push Container Images bang Earthly
  push:
    name: Push Multi-arch Images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AMD64 binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/

      - name: Set permissions
        run: chmod +x target/*/release/*

      - name: Set up QEMU & Earthly
        uses: docker/setup-qemu-action@v3
      - uses: earthly/actions-setup@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${TAG_VERSION}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and push AMD64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          earthly --push --ci \
            --platform linux/amd64 \
            --build-arg TARGET="x86_64-unknown-linux-gnu" \
            --build-arg VERSION="${VERSION}" \
            --build-arg REGISTRY="${REGISTRY}" \
            --build-arg IMAGE_PREFIX="${IMAGE_PREFIX}" \
            +all

      - name: Build and push ARM64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          earthly --push --ci \
            --platform linux/arm64 \
            --build-arg TARGET="aarch64-unknown-linux-gnu" \
            --build-arg VERSION="${VERSION}" \
            --build-arg REGISTRY="${REGISTRY}" \
            --build-arg IMAGE_PREFIX="${IMAGE_PREFIX}" \
            +all
