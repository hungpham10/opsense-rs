name: push-image

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish, for example v1.0.0
        required: true
        default: v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: hungpham10/opsense
  # Zig is not in the Ubuntu archive before 25.10, so we pin the toolchain here.
  ZIG_VERSION: 0.13.0

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build Binaries cho ca AMD64 & ARM64
  build:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build cross-arch binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # Stage binaries in a neutral dir so the artifact layout is flat
      # (same pattern as .github/workflows/ci.yml, which is proven to work).
      - name: Prepare artifact directory
        run: |
          mkdir -p dist-bin
          cp target/${{ matrix.target }}/release/opsense \
             target/${{ matrix.target }}/release/opsense-kernel-echo \
             target/${{ matrix.target }}/release/opsense-kernel-python \
             target/${{ matrix.target }}/release/opsense-kernel-julia dist-bin/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ matrix.target }}
          path: dist-bin/*
          retention-days: 1

  # Job 2: Build & Push Container Images bang Earthly
  push:
    name: Push Multi-arch Images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AMD64 binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-x86_64-unknown-linux-gnu
          path: dist-bin-amd64/

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-aarch64-unknown-linux-gnu
          path: dist-bin-arm64/

      - name: Set up QEMU & Earthly
        uses: docker/setup-qemu-action@v3
      - uses: earthly/actions-setup@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${TAG_VERSION}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Stage pre-built binaries under binaries/<arch>/. In a multi-platform
      # Earthly run, +build-binaries picks its own arch sub-directory via
      # `uname -m` (x86_64 / aarch64), so both platforms build correctly while
      # Earthly pushes ONE multi-arch manifest list under the single tag.
      - name: Stage pre-built binaries for Earthly
        run: |
          mkdir -p binaries/x86_64 binaries/aarch64
          cp dist-bin-amd64/* binaries/x86_64/
          chmod +x binaries/x86_64/*
          cp dist-bin-arm64/* binaries/aarch64/
          chmod +x binaries/aarch64/*

      # Single Earthly run (`+multi` target) for linux/amd64 + linux/arm64.
      # Earthly 0.8.x requires multi-platform via `BUILD --platform ... --platform ...`
      # in the Earthfile, not on the command line; the target pushes ONE
      # multi-arch manifest list under the single tag — no manual merge step.
      - name: Build and push multi-arch images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          earthly --push --ci \
            --build-arg VERSION="${VERSION}" \
            --build-arg REGISTRY="${REGISTRY}" \
            --build-arg IMAGE_PREFIX="${IMAGE_PREFIX}" \
            +multi

      - name: Verify multi-arch manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for img in serve runner runner-python runner-julia; do
            echo "==> ${REGISTRY}/${IMAGE_PREFIX}-${img}:${VERSION}"
            docker manifest inspect "${REGISTRY}/${IMAGE_PREFIX}-${img}:${VERSION}" \
              | jq -r '.manifests[].platform.os + "/" + .platform.architecture'
          done
