name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Setup & Unit Tests
    runs-on: ubuntu-latest

    # redis-backed unit tests in opsense-libs connect to redis://127.0.0.1:6379
    # (crates/opsense-libs/src/storage/redis.rs). The julia/python kernel
    # parity suites need their interpreters + packages; installed below so
    # the suites actually execute rather than skipping gracefully.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        # opsense-proto/build.rs invokes tonic-prost-build, which shells
        # out to `protoc`.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Verify protoc
        run: protoc --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      # ── Python kernel deps ───────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python kernel deps
        run: python3 -m pip install --upgrade pip numpy pandas pyarrow protobuf

      - name: Verify Python stack
        run: |
          python3 -c "import numpy, pandas, pyarrow; from google.protobuf import descriptor; print('python stack ok')"

      # ── Julia kernel deps ────────────────────────────────────────────
      - name: Setup Julia
        # Kernel launcher (`opsense-kernel-julia`) embeds kernel/main.jl and
        # imports Arrow/DataFrames from the depot at startup.
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia depot
        uses: julia-actions/cache@v2
        with:
          depot: ~/.julia
          cache-name: julia-depot

      - name: Install Julia kernel deps
        # DEFAULT_PACKAGES declared in crates/opsense-kernel-julia/kernel/main.jl:
        # Arrow, DataFrames, CSV, Plots.
        run: julia -e 'import Pkg; Pkg.add(["Arrow", "DataFrames", "CSV", "Plots"])'

      - name: Verify Julia stack
        run: julia -e 'using Arrow, DataFrames, CSV, Plots; println("julia deps ok")'

      # ── Cargo ────────────────────────────────────────────────────────
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Build (no run)
        # Also builds the kernel binaries referenced by the parity tests.
        run: cargo build --workspace --all-targets

      - name: Run unit tests
        run: cargo test --workspace --all-targets
