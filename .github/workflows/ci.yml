name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPSENSE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.sha) }}
  COMPOSE_PROJECT_NAME: opsense-ci-${{ github.run_id }}
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Release Binaries
    # Pin to ubuntu-22.04 (glibc 2.35) so prebuilt binaries run on the Debian
    # bookworm-based runtime images (glibc 2.36). `ubuntu-latest` is 24.04
    # (glibc 2.39) and produces binaries requiring GLIBC_2.38/2.39 symbols,
    # which fail to load in the runner-julia / runner / serve containers.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-binaries

      - name: Build workspace binaries
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --workspace --release --locked

      # SỬA LỖI CACHE: Copy binary ra thư mục biệt lập TRƯỚC KHI upload artifact
      # Giúp không làm biến đổi mtime/metadata bên trong thư mục target/
      - name: Prepare artifact directory
        run: |
          mkdir -p dist-bin
          cp target/release/opsense \
             target/release/opsense-kernel-echo \
             target/release/opsense-kernel-python \
             target/release/opsense-kernel-julia dist-bin/

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: dist-bin/*
          retention-days: 1

  # Unit tests — no docker compose needed
  unit-test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-binaries

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: dist-bin/

      - name: Run unit tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          NEXTEST_EXPERIMENTAL_LIBTEST_HARNESS: "1"
        run: cargo nextest run --workspace --locked --cargo-profile release --jobs $(nproc)

  # Prepare steps for integration tests — duplicate binaries, setup earthly, build images, save as artifact
  prepare:
    name: Prepare Integration Environment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-binaries

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: dist-bin/

      # Sao chép binary từ dist-bin/ đến các đường dẫn mà Earthly/Integration test yêu cầu
      - name: Duplicate binaries for target-specific path
        run: |
          mkdir -p target/release/
          mkdir -p target/${{ env.TARGET }}/release/
          mkdir -p binaries/
          cp -r dist-bin/* target/release/
          cp -r dist-bin/* target/${{ env.TARGET }}/release/
          cp -r dist-bin/* binaries/
          chmod +x target/release/* target/${{ env.TARGET }}/release/* binaries/*

      - name: Setup Earthly
        uses: earthly/actions-setup@v1

      - name: Build container images via Earthly
        run: |
          earthly +integration-images \
            --VERSION=${{ env.OPSENSE_TAG }} \
            --TARGET=${{ env.TARGET }}

      # Save Docker images as artifact for reuse in subsequent jobs
      - name: Save Docker images
        run: |
          mkdir -p docker-images
          docker save $(docker images --format "{{.Repository}}:{{.Tag}}" | grep opsense) > docker-images/opsense-images.tar
          ls -lh docker-images/

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ env.OPSENSE_TAG }}
          path: docker-images/
          retention-days: 1

  # Integration tests — matrix over storage strategies
  # Each strategy in strategies/*/ has config.toml
  # Full integration test runs against each strategy in parallel.
  integration:
    name: Integration Tests
    needs: [build, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        strategy: [default, local, memory, sqlite, s3, prometheus]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-binaries

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: dist-bin/

      # Duplicate binaries for target-specific path
      - name: Duplicate binaries for target-specific path
        run: |
          mkdir -p target/release/
          mkdir -p target/${{ env.TARGET }}/release/
          mkdir -p binaries/
          cp -r dist-bin/* target/release/
          cp -r dist-bin/* target/${{ env.TARGET }}/release/
          cp -r dist-bin/* binaries/
          chmod +x target/release/* target/${{ env.TARGET }}/release/* binaries/*

      # Load Docker images from prepare job
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ env.OPSENSE_TAG }}
          path: docker-images/

      - name: Load Docker images
        run: docker load < docker-images/opsense-images.tar

      - name: Verify container images
        run: docker images | grep opsense

      - name: Copy strategy config.toml
        if: matrix.strategy != 'default'
        run: |
          cp "strategies/${{ matrix.strategy }}/config.toml" conf/opsense.conf.toml
          echo "=== Config for ${{ matrix.strategy }} ==="
          cat conf/opsense.conf.toml

      - name: Validate strategy config.toml
        if: matrix.strategy != 'default'
        run: |
          cargo run -p opsense -- validate --config "strategies/${{ matrix.strategy }}/config.toml"
          echo "Config validation passed for ${{ matrix.strategy }}"

      - name: Start Compose stack
        env:
          VALKEY_PORT: "6380"
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose up -d --wait --wait-timeout 240

      - name: Debug Compose status (if unhealthy)
        if: always()
        run: |
          echo "=== Compose PS ==="
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json
          echo "=== opsense-serve logs ==="
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose logs --tail 100 opsense-serve || true
          echo "=== opsense-runner logs ==="
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose logs --tail 50 opsense-runner || true

      - name: Verify Compose services
        run: |
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -r '.[] | "\(.Service): \(.Health)"' \
            | tee compose-health.txt
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -e 'length > 0 and all(.Health == "healthy")' \
            > /dev/null \
            || (echo "FAIL: not all services healthy" && cat compose-health.txt && exit 1)

      - name: Run integration tests
        env:
          OPSENSE_SERVE_URL: http://localhost:8080
          OPSENSE_RUNNER_ECHO: 127.0.0.1:50051
          OPSENSE_RUNNER_PYTHON: 127.0.0.1:50052
          OPSENSE_RUNNER_JULIA: 127.0.0.1:50053
          DB_DSN: postgres://opsense:opsense123@127.0.0.1:5432/opsense
          OPSENSE_INTEGRATION: 'true'
          VALKEY_PORT: "6380"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6380"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Bỏ dòng --config 'profile.ci-test...' đi vì nó ép Cargo compile lại lần nữa
          cargo test --workspace --locked --release \
            --test integration_health \
            --test integration_oauth \
            --test integration_runner_grpc \
            --test integration_repl_pty \
            --test integration_storage \
            --test integration_s3_lake \
            -- --test-threads=1 --nocapture

      - name: Cleanup Compose stack
        if: always()
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose down -v

      - name: Run integration tests for ${{ matrix.strategy }}
        env:
          OPSENSE_TAG: ${{ env.OPSENSE_TAG }}
          OPSENSE_S3_ACCESS_KEY_ID: opsense
          OPSENSE_S3_SECRET_ACCESS_KEY: opsense123
          VALKEY_PORT: "6380"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6380"
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -e
          echo "=========================================="
          echo "STRATEGY: ${{ matrix.strategy }}"
          echo "=========================================="
          OPSENSE_SERVE_URL=http://localhost:8080 \
          OPSENSE_DEX_ISSUER=http://localhost:5556/dex \
          OPSENSE_RUNNER_ECHO=127.0.0.1:50051 \
          OPSENSE_RUNNER_PYTHON=127.0.0.1:50052 \
          OPSENSE_RUNNER_JULIA=127.0.0.1:50053 \
          DB_DSN=postgres://opsense:opsense123@127.0.0.1:5432/opsense \
          OPSENSE_INTEGRATION=true \
          RUSTC_WRAPPER=sccache \
          SCCACHE_GHA_ENABLED=true \
          cargo test --workspace --locked --release \
            --test integration_health \
            --test integration_oauth \
            --test integration_runner_grpc \
            --test integration_repl_pty \
            --test integration_storage \
            --test integration_s3_lake \
            -- --test-threads=1 --nocapture

      - name: Cleanup Compose stack
        if: always()
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose down -v