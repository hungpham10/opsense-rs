name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPSENSE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.sha) }}
  COMPOSE_PROJECT_NAME: opsense-ci-${{ github.run_id }}
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Khai báo ID job là 'build-binaries'
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-binaries

      - name: Build workspace binaries
        run: cargo build --workspace --release --locked

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: |
            target/release/opsense
            target/release/opsense-kernel-echo
            target/release/opsense-kernel-python
            target/release/opsense-kernel-julia
          retention-days: 1

  # Job 2: Phụ thuộc vào job 'build-binaries'
  test:
    name: Unit & Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip numpy pandas pyarrow protobuf

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Install Julia dependencies
        run: julia -e 'import Pkg; Pkg.add(["Arrow", "DataFrames", "CSV", "Plots"])'

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/

      - name: Make binaries executable
        run: chmod +x target/${{ env.TARGET }}/release/*

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Setup Earthly
        uses: earthly/actions-setup@v1

      - name: Build container images via Earthly
        run: |
          earthly +integration-images \
            --VERSION=${{ env.OPSENSE_TAG }} \
            --TARGET=${{ env.TARGET }}

      - name: Start Compose stack
        env:
          VALKEY_PORT: "6380"
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose up -d --wait --wait-timeout 240

      - name: Verify Compose services
        run: |
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -r '.[] | "\(.Service): \(.Health)"' \
            | tee compose-health.txt
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -e 'length > 0 and all(.Health == "healthy")' \
            > /dev/null \
            || (echo "FAIL: not all services healthy" && cat compose-health.txt && exit 1)

      - name: Run integration tests
        env:
          OPSENSE_SERVE_URL: http://localhost:8080
          OPSENSE_RUNNER_ECHO: 127.0.0.1:50051
          OPSENSE_RUNNER_PYTHON: 127.0.0.1:50052
          OPSENSE_RUNNER_JULIA: 127.0.0.1:50053
          DB_DSN: postgres://opsense:opsense123@127.0.0.1:5432/opsense
          OPSENSE_INTEGRATION: 'true'
          VALKEY_PORT: "6380"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6380"
        run: |
          cargo test --workspace --locked \
            --test integration_health \
            --test integration_oauth \
            --test integration_runner_grpc \
            --test integration_repl_pty \
            -- --test-threads=1 --nocapture

      - name: Cleanup Compose stack
        if: always()
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose down -v
