name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPSENSE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.sha) }}
  COMPOSE_PROJECT_NAME: opsense-ci-${{ github.run_id }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build, Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Verify protoc
        run: protoc --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python kernel dependencies
        run: python3 -m pip install --upgrade pip numpy pandas pyarrow protobuf

      - name: Verify Python stack
        run: |
          python3 -c "import numpy, pandas, pyarrow; from google.protobuf import descriptor; print('python stack ok')"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia depot
        uses: julia-actions/cache@v2
        with:
          depot: ~/.julia
          cache-name: julia-depot

      - name: Install Julia kernel dependencies
        run: julia -e 'import Pkg; Pkg.add(["Arrow", "DataFrames", "CSV", "Plots"])'

      - name: Verify Julia stack
        run: julia -e 'using Arrow, DataFrames, CSV, Plots; println("julia deps ok")'

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Run unit tests
        run: cargo test --workspace --all-targets --locked

      - name: Setup Earthly
        uses: earthly/actions-setup@v1

      - name: Build container images
        run: earthly +integration-images --VERSION=${{ env.OPSENSE_TAG }}

      - name: Start Compose stack
        env:
          VALKEY_PORT: "6380"
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose up -d --wait --wait-timeout 240

      - name: Verify Compose services
        run: |
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -r '.[] | "\(.Service): \(.Health)"' \
            | tee compose-health.txt
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps --format json \
            | jq -s -e 'length > 0 and all(.Health == "healthy")' \
            > /dev/null \
            || (echo "FAIL: not all services healthy" && cat compose-health.txt && exit 1)

      - name: Wait for runner ports on the host
        run: |
          for port in 50051 50052 50053; do
            ok=0
            for _ in $(seq 1 30); do
              if python3 -c "import socket; s=socket.create_connection(('127.0.0.1', $port), 1); s.close()"; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "FAIL: 127.0.0.1:$port not listening (echo/python/julia runners)"
              OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose ps
              exit 1
            fi
          done

      - name: Run integration tests
        env:
          OPSENSE_SERVE_URL: http://localhost:8080
          OPSENSE_RUNNER_ECHO: 127.0.0.1:50051
          OPSENSE_RUNNER_PYTHON: 127.0.0.1:50052
          OPSENSE_RUNNER_JULIA: 127.0.0.1:50053
          DB_DSN: postgres://opsense:opsense123@127.0.0.1:5432/opsense
          OPSENSE_INTEGRATION: 'true'
          VALKEY_PORT: "6380"
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6380"
        run: |
          cargo test --workspace --locked \
            --test integration_health \
            --test integration_oauth \
            --test integration_runner_grpc \
            --test integration_repl_pty \
            -- --test-threads=1 --nocapture

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose logs --no-color --tail=300 > compose-failure.log
          cat compose-failure.log

      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-failure.log

      - name: Cleanup Compose stack
        if: always()
        run: OPSENSE_TAG=${{ env.OPSENSE_TAG }} docker compose down -v
