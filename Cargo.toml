[workspace]
resolver = "3"
members = [
	"crates/opsense",
	"crates/opsense-core",
	"crates/opsense-model",
	"crates/opsense-macros",
	"crates/opsense-mlib",
	"crates/opsense-rhai",
	"crates/opsense-qlib",
	"crates/opsense-components",
	"crates/opsense-proto",
	"crates/opsense-kernel-echo",
	"crates/opsense-kernel-python",
	"crates/opsense-kernel-julia",
	"crates/opsense-runner",
]

[workspace.package]
version = "1.0.12"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/hungpham10/opsense-rs"
homepage = "https://github.com/hungpham10/opsense-rs"
authors = ["Hung <hung0913208@gmail.com>"]

[workspace.dependencies]
# Core
async-trait = "0.1"
anyhow = "1"
bytes = "1"
tokio = { version = "1.49.0", default-features = false, features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
futures = "0.3"
futures-util = { version = "0.3", features = ["sink"] }

# Debuging
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# TLS via rustls (not OpenSSL) so cross builds don't need libssl-dev;
# keep the remaining default features (charset/http2/macos-system-configuration)
# for parity with the old default-tls build.
#
# `rustls-tls-native-roots-**no-provider**` is REQUIRED, not a style choice.
# reqwest 0.12's non-`no-provider` features hard-wire `__rustls-ring`
# (→ `rustls/ring`), while the AWS SDK S3 stack (aws-config →
# aws-smithy-runtime/default-https-client → aws-smithy-http-client/
# rustls-aws-lc) hard-wires `rustls/aws_lc_rs`. Both on the SAME rustls
# 0.23 build ⇒ "Could not automatically determine the process-level
# CryptoProvider" panic at the first TLS handshake, i.e. every outbound
# https/wss in `opsense serve` dies (http_source + websocket_2_json). The
# `-no-provider` variant leaves provider selection to us; the AWS SDK already
# pins `aws_lc_rs`, and `crates/opsense/src/main.rs` installs it explicitly.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "cookies", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots-no-provider"] }

# Single rustls provider for the whole build. Must match the one the AWS SDK
# enables (`aws_lc_rs`); declaring it here keeps the choice ours instead of
# borrowed from a transitive dependency, and `install_default()` in
# `crates/opsense/src/main.rs` makes the runtime pick explicit.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"

# Machine learning
tract-onnx = "0.23.2"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
utoipa = "5"
rand = "=0.8.8"
typetag = "0.2.21"
parking_lot = "0.12"
dashmap = "6"

# Scripting: Rhai transform engine for opsense-components. `serde` enables
# `rhai::serde::to_dynamic`/`from_dynamic` (observation-map <-> JSON bridge);
# `sync` makes the engine Send/Sync so spawn_blocking shares it across threads.
rhai = { version = "1.21", features = ["serde", "sync"] }

# Dependencies
# Parquet storage backend: arrow-array/arrow-schema +
# parquet for data files, object_store for the S3 mirror. We use the split
# sub-crates directly (not the `arrow` facade) since the parquet code only
# needs schemas + arrays + RecordBatch, and the facade pulls `arrow-arith`
# which breaks against chrono >= 0.4.42.
base64 = { version = "=0.22.1" }
arrow-array = { version = "=56.0.0" }
arrow-schema = { version = "=56.0.0" }
parquet = { version = "=56.0.0", default-features = false, features = ["arrow", "zstd", "arrow-array", "arrow-schema"] }
# Arrow split sub-crates used by the REPL kernel `:export` path. We use
# arrow-ipc/arrow-csv directly instead of the `arrow` facade.
arrow-ipc = "=56.0.0"
arrow-csv = "=56.0.0"
# Used by opsense-runner `segment_to_record_batch` (Arrow IPC re-assembly).
arrow-select = "=56.0.0"
object_store = { version = "=0.11.2", default-features = false, features = ["aws"] }
redis = { version = "=1.0.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "=0.8.0", default-features = false, features = ["any", "chrono", "mysql", "postgres", "runtime-tokio", "sqlite"] }

# gRPC kernel runner wire protocol (opsense-proto codegen)
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }

# REPL / TUI (opsense `repl` subcommand)
reedline = "0.49"
comfy-table = "7"

# cargo-dist builds release artifacts with `cargo build --profile dist`.
# Without this profile its builds abort with "profile `dist` is not defined".
[profile.dist]
inherits = "release"
lto = "thin"
