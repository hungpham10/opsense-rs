[workspace]
resolver = "2"
members = [
	"crates/opsense",
	"crates/opsense-libs",
	"crates/opsense-core",
	"crates/opsense-components",
	"crates/opsense-model",
	"crates/opsense-macros",
	"crates/opsense-proto",
	"crates/opsense-kernel-echo",
	"crates/opsense-runner",
	"crates/opsense-kernel-python",
	"crates/opsense-kernel-julia"
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hungpham10/opsense-rs"
homepage = "https://github.com/hungpham10/opsense-rs"
authors = ["Hung <hung.pham10@icloud.com>"]

[workspace.dependencies]
axum = "0.8.8"
axum-metrics = "0.2.0"
axum-macros = "0.5.0"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
axum-prometheus = "0.10.0"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
headers = "0.4.1"
http = "1.4.0"
http-body-util = "0.1.3"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
sentry = { version = "0.49.1", features = ["tower-http"] }
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "metrics"] }
tracing-opentelemetry = "0.33.0"

dotenvy = "0.15.7"
clap = { version = "4.5.57", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }

arrow = { version = "56", features = ["ipc", "json", "csv"] }
parquet = { version = "56", features = ["arrow", "async"] }
arrow-schema = "56"
arrow-array = "56"

reedline = "0.39"
comfy-table = "7"
plotters = { version = "0.3", features = ["terminal"] }
uuid = { version = "1.12", features = ["v4", "v7", "serde"] }
rmcp = { version = "0.6", features = ["server", "transport-io", "macros"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
bytes = "1"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
async-trait = "0.1"
futures = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
redis = { version = "1.0", features = ["tokio-comp"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql", "any"] }
duckdb = { version = "1.10505.0", default-features = false, features = ["bundled", "loadable-extension"] }
lmdb-rkv = "0.14"
thiserror = "2"
log = "0.4.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Shared utility crates
base64 = "0.22"
libc = "0.2"
typetag = "0.2.21"
utoipa = "5"
dashmap = "6"
parking_lot = "0.12"
rhai = { version = "1", features = ["sync", "serde"] }
zstd = "0.13"
bincode = "1.3"
tempfile = "3"
ed25519-dalek = "2"
rand = "0.8"
subtle = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
