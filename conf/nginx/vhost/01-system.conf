location = /health {
    proxy_pass http://backend/health;
    proxy_set_header Host $host;
    access_log off;
}

# Liveness cho peer trong mesh: node kia gọi path này để biết ta còn sống.
# Không có auth — nó chỉ nói "tiến trình này còn đáp ứng", đúng như `/health`
# bên trên, và mọi endpoint `/api/*` đều đã qua OIDC.
location = /health/live {
    proxy_pass http://backend/health/live;
    proxy_set_header Host $host;
    access_log off;
}

location = /metrics {
    proxy_pass http://backend/metrics;
    proxy_set_header Host $host;
    access_log off;
}

location = /debug/pprof/profile {
    proxy_pass http://backend/debug/pprof/profile;
    proxy_set_header Host $host;
    access_log off;
}

location ~ /\.ht { deny all; }
