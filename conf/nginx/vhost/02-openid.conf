# ====================================================================
# OIDC Login / Logout / Callback — dynamic per-tenant
# ====================================================================
#   Tất cả đều fetch tenant auth config từ Axum dựa trên host + oidc_name
#   để đảm bảo client_id / client_secret / cache_segment đồng bộ
#   với các location protection (04-api.conf, 05-docs.conf).
#
#   oidc_name được xác định qua map $uri $oidc_name ở 01-jwt.conf
#   (mặc định "default" cho mọi route).
# ====================================================================

# ──────────────────────────────────────────────────────────────────────
# /login — khởi tạo đăng nhập
#   oidc_name lấy từ $uri (01-jwt.conf), mặc định "default"
# ──────────────────────────────────────────────────────────────────────
location = /login {
    access_by_lua_block {
        local openidc = require("resty.openidc")
        local http = require("resty.http")
        local cjson = require("cjson")

        local host = ngx.var.host
        local oidc_name = ngx.var.oidc_name or "default"

        -----------------------------------------------------------------
        -- BƯỚC 1: GỌI ĐỘNG XUỐNG AXUM LẤY AUTH CONFIG
        -----------------------------------------------------------------
        local cache_key = "auth:" .. host .. ":" .. oidc_name
        local tenant_config_raw = ngx.shared.tenant:get(cache_key)
        local tenant_config

        if not tenant_config_raw then
            local httpc = http.new()
            local ok, err = httpc:connect("unix:/var/run/axum")

            if ok then
                local res, _ = httpc:request({
                    path = "/api/admin/v1/seo/tenant/" .. host .. "/auth-config?name=" .. oidc_name,
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })

                if res and res.status == 200 then
                    tenant_config_raw = res:read_body()
                    ngx.shared.tenant:set(cache_key, tenant_config_raw, 600)
                end
                httpc:set_keepalive()
            end
        end

        -- Fallback: nếu ko có dynamic config, dùng env vars (backward compat)
        if not tenant_config_raw then
            ngx.log(ngx.WARN, "[login] No tenant config for " .. host .. "/" .. oidc_name .. ", fallback to env vars")
            tenant_config_raw = cjson.encode({
                auth = {
                    id = 0,
                    oidc_issuer = os.getenv("OIDC_ISSUER"),
                    oidc_client_id = os.getenv("OIDC_CLIENT_ID"),
                    oidc_client_secret = os.getenv("OIDC_CLIENT_SECRET"),
                    oidc_expected_alg = "RS256",
                    session_secret = os.getenv("OIDC_SESSION_SECRET")
                }
            })
        end

        tenant_config = cjson.decode(tenant_config_raw)

        -----------------------------------------------------------------
        -- BƯỚC 2: OIDC AUTH
        -----------------------------------------------------------------
        local opts = {
            discovery = tenant_config.auth.oidc_issuer .. "/.well-known/openid-configuration",
            client_id = tenant_config.auth.oidc_client_id,
            client_secret = tenant_config.auth.oidc_client_secret,
            redirect_uri = "https://" .. host .. "/callback?oidc_name=" .. oidc_name,
            scope = "openid email profile offline_access",
            token_signing_alg_values_expected = { tenant_config.auth.oidc_expected_alg or "RS256" },
            ssl_verify = "yes",
            accept_none_alg = false,
            accept_unsupported_alg = false,
            refresh_session_interval = 300,
            cache_segment = 'oidc_cache_' .. (tenant_config.auth.id or 0),
            session_contents = {id_token=true, user=true, access_token=true, refresh_token=true}
        }

        local session_opts = {
            compress = false,
            cookie_http_only = true,
            cookie_secure = true,
            cookie_same_site = "Lax",
            remember = true,
            secret = tenant_config.auth.session_secret or os.getenv("OIDC_SESSION_SECRET"),
            storage = "redis",
            redis = {
                host = os.getenv("REDIS_HOST"),
                username = os.getenv("REDIS_USERNAME"),
                password = os.getenv("REDIS_PASSWORD"),
                port = tonumber(os.getenv("REDIS_PORT")),
                db = 0,
                connect_timeout = 500,
                read_timeout = 2000,
                send_timeout = 2000
            }
        }

        local res, err = openidc.authenticate(opts, nil, nil, session_opts)
        if err then
            ngx.log(ngx.ERR, "[login] OIDC auth failed for " .. host .. "/" .. oidc_name .. ": " .. err)
            ngx.header["Content-Type"] = "application/json"
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            return ngx.say(cjson.encode({ error = "Login initiation failed: " .. err }))
        end
        ngx.redirect("/")
    }
}

# ──────────────────────────────────────────────────────────────────────
# /logout — đăng xuất
#   oidc_name lấy từ $uri (01-jwt.conf), mặc định "default"
# ──────────────────────────────────────────────────────────────────────
location = /logout {
    access_by_lua_block {
        local openidc = require("resty.openidc")
        local http = require("resty.http")
        local cjson = require("cjson")

        local host = ngx.var.host
        local oidc_name = ngx.var.oidc_name or "default"

        -----------------------------------------------------------------
        -- BƯỚC 1: GỌI ĐỘNG XUỐNG AXUM LẤY AUTH CONFIG
        -----------------------------------------------------------------
        local cache_key = "auth:" .. host .. ":" .. oidc_name
        local tenant_config_raw = ngx.shared.tenant:get(cache_key)
        local tenant_config

        if not tenant_config_raw then
            local httpc = http.new()
            local ok, err = httpc:connect("unix:/var/run/axum")

            if ok then
                local res, _ = httpc:request({
                    path = "/api/admin/v1/seo/tenant/" .. host .. "/auth-config?name=" .. oidc_name,
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })

                if res and res.status == 200 then
                    tenant_config_raw = res:read_body()
                    ngx.shared.tenant:set(cache_key, tenant_config_raw, 600)
                end
                httpc:set_keepalive()
            end
        end

        if not tenant_config_raw then
            ngx.log(ngx.WARN, "[logout] No tenant config for " .. host .. "/" .. oidc_name .. ", fallback to env vars")
            tenant_config_raw = cjson.encode({
                auth = {
                    id = 0,
                    oidc_issuer = os.getenv("OIDC_ISSUER"),
                    oidc_client_id = os.getenv("OIDC_CLIENT_ID"),
                    oidc_client_secret = os.getenv("OIDC_CLIENT_SECRET"),
                    oidc_expected_alg = "RS256",
                    session_secret = os.getenv("OIDC_SESSION_SECRET")
                }
            })
        end

        tenant_config = cjson.decode(tenant_config_raw)

        -----------------------------------------------------------------
        -- BƯỚC 2: OIDC LOGOUT
        -----------------------------------------------------------------
        local opts = {
            discovery = tenant_config.auth.oidc_issuer .. "/.well-known/openid-configuration",
            client_id = tenant_config.auth.oidc_client_id,
            client_secret = tenant_config.auth.oidc_client_secret,
            redirect_after_logout_uri = "https://" .. host .. "/",
            scope = "openid email profile",
            token_signing_alg_values_expected = { tenant_config.auth.oidc_expected_alg or "RS256" },
            ssl_verify = "yes",
            accept_none_alg = false,
            accept_unsupported_alg = false,
            cache_segment = 'oidc_cache_' .. (tenant_config.auth.id or 0)
        }

        local session_opts = {
            compress = false,
            cookie_http_only = true,
            cookie_secure = true,
            cookie_same_site = "Lax",
            remember = true,
            secret = tenant_config.auth.session_secret or os.getenv("OIDC_SESSION_SECRET"),
            storage = "redis",
            redis = {
                host = os.getenv("REDIS_HOST"),
                username = os.getenv("REDIS_USERNAME"),
                password = os.getenv("REDIS_PASSWORD"),
                port = tonumber(os.getenv("REDIS_PORT")),
                db = 0,
                connect_timeout = 500,
                read_timeout = 2000,
                send_timeout = 2000
            }
        }

        -- Kiểm tra nếu có session hợp lệ → logout
        local session = require("resty.session").open(session_opts)
        if session.present and session.data.id_token then
            local res, err = openidc.authenticate(opts, nil, "logout", session_opts)
            if err then
                ngx.log(ngx.ERR, "[logout] failed for " .. host .. "/" .. oidc_name .. ": " .. err)
            end
        end

        ngx.redirect("https://" .. host .. "/")
    }
}

# ──────────────────────────────────────────────────────────────────────
# /callback — Auth0 redirect về đây sau khi user login
#   oidc_name lấy từ $uri (01-jwt.conf), mặc định "default"
#
#   Code flow:
#     1. Dùng host để fetch tenant auth config từ Axum (hoặc cache)
#     2. Dùng dynamic client_id / client_secret / cache_segment
#        để exchange auth code lấy token
# ──────────────────────────────────────────────────────────────────────
location = /callback {
    access_by_lua_block {
        local openidc = require("resty.openidc")
        local http = require("resty.http")
        local cjson = require("cjson")

        local host = ngx.var.host
        local oidc_name = ngx.var.arg_oidc_name or ngx.var.oidc_name or "default"

        -----------------------------------------------------------------
        -- BƯỚC 1: GỌI ĐỘNG XUỐNG AXUM LẤY AUTH CONFIG (bắt buộc)
        -----------------------------------------------------------------
        -- Với callback, bắt buộc phải có dynamic config để đảm bảo
        -- cache_segment đồng bộ với config đã dùng lúc redirect.
        -- Không fallback sang env vars vì sẽ gây session mismatch.
        -----------------------------------------------------------------
        local cache_key = "auth:" .. host .. ":" .. oidc_name
        local tenant_config_raw = ngx.shared.tenant:get(cache_key)
        local tenant_config

        if not tenant_config_raw then
            local httpc = http.new()
            local ok, err = httpc:connect("unix:/var/run/axum")

            if ok then
                local res, _ = httpc:request({
                    path = "/api/admin/v1/seo/tenant/" .. host .. "/auth-config?name=" .. oidc_name,
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })

                if res and res.status == 200 then
                    tenant_config_raw = res:read_body()
                    ngx.shared.tenant:set(cache_key, tenant_config_raw, 600)
                else
                    ngx.log(ngx.ERR, "[callback] tenant fetch for " .. host .. "/" .. oidc_name .. " returned status: " .. tostring(res and res.status))
                end
                httpc:set_keepalive()
            else
                ngx.log(ngx.ERR, "[callback] failed to connect to axum socket: " .. tostring(err))
            end
        end

        if not tenant_config_raw then
            ngx.status = 500
            ngx.header["Content-Type"] = "application/json"
            return ngx.say(cjson.encode({
                error = "Callback authentication failed: unable to load tenant auth config",
                host = host,
                oidc_name = oidc_name
            }))
        end

        tenant_config = cjson.decode(tenant_config_raw)

        -----------------------------------------------------------------
        -- BƯỚC 2: EXCHANGE AUTH CODE → TOKEN
        -----------------------------------------------------------------
        local opts = {
            discovery = tenant_config.auth.oidc_issuer .. "/.well-known/openid-configuration",
            client_id = tenant_config.auth.oidc_client_id,
            client_secret = tenant_config.auth.oidc_client_secret,
            redirect_uri = "https://" .. host .. "/callback?oidc_name=" .. oidc_name,
            scope = "openid email profile offline_access",
            token_signing_alg_values_expected = { tenant_config.auth.oidc_expected_alg or "RS256" },
            ssl_verify = "yes",
            accept_none_alg = false,
            accept_unsupported_alg = false,
            refresh_session_interval = 300,
            cache_segment = 'oidc_cache_' .. (tenant_config.auth.id or 0),
            session_contents = {id_token=true, user=true, access_token=true, refresh_token=true}
        }

        local session_opts = {
            compress = false,
            cookie_http_only = true,
            cookie_secure = true,
            cookie_same_site = "Lax",
            remember = true,
            secret = tenant_config.auth.session_secret or os.getenv("OIDC_SESSION_SECRET"),
            storage = "redis",
            redis = {
                host = os.getenv("REDIS_HOST"),
                username = os.getenv("REDIS_USERNAME"),
                password = os.getenv("REDIS_PASSWORD"),
                port = tonumber(os.getenv("REDIS_PORT")),
                db = 0,
                connect_timeout = 500,
                read_timeout = 2000,
                send_timeout = 2000
            }
        }

        local res, err, target = openidc.authenticate(opts, nil, nil, session_opts)
        if err then
            ngx.log(ngx.ERR, "[callback] authentication failed for " .. host .. "/" .. oidc_name .. ": " .. err)
            ngx.header["Content-Type"] = "application/json"
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            return ngx.say(cjson.encode({ error = "Callback authentication failed: " .. err }))
        end
        ngx.redirect(target or "/")
    }
}
