            }

            -- Thực hiện Authenticate OIDC
            local res, err, target, session = openidc.authenticate(opts, nil, nil, session_opts)

            if err then
                ngx.log(ngx.ERR, "OIDC authentication failed for " .. host .. ": " .. err)
                ngx.header["Content-Type"] = "application/json"
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say(cjson.encode({ error = "OIDC authentication failed: " .. err }))
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            if not res.id_token then
                if ngx.var.jwt_required == "2" then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say(cjson.encode({ error = "Missing Authorization" }))
                    ngx.exit(401)
                else
                    ngx.req.set_header("X-Is-Guest", "true")
                    return
                end
            end

            -- Validate tính hợp lệ của token dựa trên cấu hình tenant (Chống tấn công chéo token)
            if res.id_token.iss ~= tenant_config.auth.oidc_issuer and res.id_token.iss ~= tenant_config.auth.oidc_issuer .. "/" then
                ngx.status = 401
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ error = "Invalid token issuer" }))
                ngx.exit(401)
            end

            if res.id_token.aud ~= tenant_config.auth.oidc_client_id then
                ngx.status = 401
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ error = "Invalid token audience" }))
                ngx.exit(401)
            end

            -- Gán dữ liệu user thành công xuống backend
            ngx.req.set_header("X-User-Id", res.id_token.sub)
            if res.user and res.user.email then
                ngx.req.set_header("X-User-Email", res.user.email)
            end
        end
    }
    # --- Inject CORS và Chuyển tiếp Request xuống Axum backend ---
    add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-Tenant-Id' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kích hoạt tính năng WebSocket Upgrade Handshake của Nginx
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cấu hình timeout dài để giữ kết nối WebSocket liên tục không bị ngắt ngầm
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
