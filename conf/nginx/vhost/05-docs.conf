# ====================================================================
# Swagger docs proxy — auth động per tenant (giống 04-api.conf)
# ====================================================================
#   Bước 1: Gọi Axum lấy auth config theo host (cache 10 phút)
#   Bước 2: OIDC authenticate với session cookie (browser)
#   Bước 3: Inject user headers → proxy backend
# ====================================================================

location ~ ^/(docs|api-docs|swagger|apidocs|swagger-ui) {
    if ($doc_type = 0) {
        return 404;
    }

    access_by_lua_block {
        local openidc = require("resty.openidc")
        local http = require("resty.http")
        local cjson = require("cjson")

        local host = ngx.var.host
        local oidc_name = ngx.var.oidc_name or "default"

        -----------------------------------------------------------------
        -- BƯỚC 1: GỌI ĐỘNG XUỐNG AXUM LẤY AUTH CONFIG
        -----------------------------------------------------------------
        local cache_key = "auth:" .. host .. ":" .. oidc_name
        local tenant_config_raw = ngx.shared.tenant:get(cache_key)
        local tenant_config

        if not tenant_config_raw then
            local httpc = http.new()
            local ok, err = httpc:connect("unix:/var/run/axum")

            if ok then
                local res, _ = httpc:request({
                    path = "/api/admin/v1/tenant/" .. host .. "/auth-config?name=" .. oidc_name,
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })

                if res and res.status == 200 then
                    tenant_config_raw = res:read_body()
                    ngx.shared.tenant:set(cache_key, tenant_config_raw, 600)
                else
                    ngx.log(ngx.ERR, "[docs] tenant fetch for " .. host .. " returned status: " .. tostring(res and res.status))
                end
                httpc:set_keepalive()
            else
                ngx.log(ngx.ERR, "[docs] failed to connect to axum socket for " .. host .. ": " .. tostring(err))
            end
        end

        if not tenant_config_raw then
            ngx.status = 500
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Tenant auth configuration failed to load", host = host, oidc = oidc_name }))
            ngx.exit(500)
        end

        tenant_config = cjson.decode(tenant_config_raw)
        ngx.req.set_header("X-Tenant-Id", tenant_config.auth.id or "")

        -----------------------------------------------------------------
        -- BƯỚC 2: OIDC AUTH — cookie session (browser users)
        -----------------------------------------------------------------
        -- Docs chỉ dùng cookie, không check Bearer token
        local opts = {
            discovery = tenant_config.auth.oidc_issuer .. "/.well-known/openid-configuration",
            client_id = tenant_config.auth.oidc_client_id,
            client_secret = tenant_config.auth.oidc_client_secret,
            redirect_uri = "https://" .. host .. "/callback?oidc_name=" .. oidc_name,
            scope = "openid email profile offline_access",
            token_signing_alg_values_expected = { tenant_config.auth.oidc_expected_alg },
            ssl_verify = "yes",
            bearer_only = false,
            accept_none_alg = false,
            accept_unsupported_alg = false,
            refresh_session_interval = 300,
            cache_segment = 'oidc_cache_' .. tenant_config.auth.id,
            session_contents = {id_token=true, user=true, access_token=true, refresh_token=true}
        }

        local session_opts = {
            compress = false,
            cookie_http_only = true,
            cookie_secure = true,
            cookie_same_site = "Lax",
            remember = true,
            secret = tenant_config.auth.session_secret,
            storage = "redis",
            redis = {
                host = os.getenv("REDIS_HOST"),
                username = os.getenv("REDIS_USERNAME"),
                password = os.getenv("REDIS_PASSWORD"),
                port = tonumber(os.getenv("REDIS_PORT")),
                db = 0,
                connect_timeout = 500,
                read_timeout = 2000,
                send_timeout = 2000
            }
        }

        -- Nếu chưa có session cookie → tự động redirect Auth0
        -- Auth0 → /callback (02-openid.conf) → tạo session → quay lại
        local res, err, target, session = openidc.authenticate(opts, nil, nil, session_opts)

        if err then
            ngx.log(ngx.ERR, "[docs] OIDC auth failed for " .. host .. ": " .. err)
            ngx.status = ngx.HTTP_UNAUTHORIZED
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Authentication failed: " .. err }))
            ngx.exit(ngx.HTTP_UNAUTHORIZED)
        end

        if not res.id_token then
            ngx.status = 401
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Unauthorized" }))
            ngx.exit(401)
        end

        -- Validate token issuer (chống tấn công chéo token)
        if res.id_token.iss ~= tenant_config.auth.oidc_issuer
            and res.id_token.iss ~= tenant_config.auth.oidc_issuer .. "/" then
            ngx.status = 401
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Invalid token issuer" }))
            ngx.exit(401)
        end

        if res.id_token.aud ~= tenant_config.auth.oidc_client_id then
            ngx.status = 401
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Invalid token audience" }))
            ngx.exit(401)
        end

        -- Inject user info headers cho backend
        ngx.req.set_header("X-Auth-User-Id", res.id_token.sub)
        if res.user and res.user.email then
            ngx.req.set_header("X-Auth-Email", res.user.email)
        end
    }

    add_header X-Oidc-Name "$oidc_name" always;
    add_header X-Doc-Type "$doc_type" always;
    add_header X-Jwt-Required "$jwt_required" always;
    add_header X-Request-Method "$request_method" always;
    add_header X-Request-URI "$request_uri" always;

    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}

# ──────────────────────────────────────────────────────────────────────────────
# /.well-known/openapi.json  →  rewrite vào /docs/openapi.json
# ──────────────────────────────────────────────────────────────────────────────
location = /.well-known/openapi.json {
    rewrite ^ /docs/openapi.json last;
}

# ──────────────────────────────────────────────────────────────────────────────
# /docs/openapi.json — protected + tenant resolution
# ──────────────────────────────────────────────────────────────────────────────
location = /docs/openapi.json {
    set $dynamic_path "";

    access_by_lua_block {
        local openidc = require("resty.openidc")
        local http = require("resty.http")
        local cjson = require("cjson")

        local host = ngx.var.host
        local oidc_name = ngx.var.oidc_name or "default"

        -- === Bước 1: Lấy auth config ===
        local cache_key = "auth:" .. host .. ":" .. oidc_name
        local tenant_config_raw = ngx.shared.tenant:get(cache_key)
        local tenant_config

        if not tenant_config_raw then
            local httpc = http.new()
            local ok, err = httpc:connect("unix:/var/run/axum")

            if ok then
                local res, _ = httpc:request({
                    path = "/api/admin/v1/tenant/" .. host .. "/auth-config?name=" .. oidc_name,
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })

                if res and res.status == 200 then
                    tenant_config_raw = res:read_body()
                    ngx.shared.tenant:set(cache_key, tenant_config_raw, 600)
                else
                    ngx.log(ngx.ERR, "[docs/openapi] tenant fetch for " .. host .. " returned status: " .. tostring(res and res.status))
                end
                httpc:set_keepalive()
            else
                ngx.log(ngx.ERR, "[docs/openapi] failed to connect to axum socket for " .. host .. ": " .. tostring(err))
            end
        end

        if not tenant_config_raw then
            ngx.status = 500
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Tenant auth configuration failed to load", host = host, oidc = oidc_name }))
            ngx.exit(500)
        end

        tenant_config = cjson.decode(tenant_config_raw)
        ngx.req.set_header("X-Tenant-Id", tenant_config.auth.id or "")

        -- === Bước 2: OIDC auth ===
        local opts = {
            discovery = tenant_config.auth.oidc_issuer .. "/.well-known/openid-configuration",
            client_id = tenant_config.auth.oidc_client_id,
            client_secret = tenant_config.auth.oidc_client_secret,
            redirect_uri = "https://" .. host .. "/callback?oidc_name=" .. oidc_name,
            scope = "openid email profile offline_access",
            token_signing_alg_values_expected = { tenant_config.auth.oidc_expected_alg },
            ssl_verify = "yes",
            bearer_only = false,
            accept_none_alg = false,
            accept_unsupported_alg = false,
            refresh_session_interval = 300,
            cache_segment = 'oidc_cache_' .. tenant_config.auth.id,
            session_contents = {id_token=true, user=true, access_token=true, refresh_token=true}
        }

        local session_opts = {
            compress = false,
            cookie_http_only = true,
            cookie_secure = true,
            cookie_same_site = "Lax",
            remember = true,
            secret = tenant_config.auth.session_secret,
            storage = "redis",
            redis = {
                host = os.getenv("REDIS_HOST"),
                username = os.getenv("REDIS_USERNAME"),
                password = os.getenv("REDIS_PASSWORD"),
                port = tonumber(os.getenv("REDIS_PORT")),
                db = 0,
                connect_timeout = 500,
                read_timeout = 2000,
                send_timeout = 2000
            }
        }

        local res, err = openidc.authenticate(opts, nil, nil, session_opts)
        if err then
            ngx.log(ngx.ERR, "[docs] OIDC auth failed for openapi.json: " .. err)
            ngx.status = 401
            ngx.header["Content-Type"] = "application/json"
            ngx.say(cjson.encode({ error = "Authentication failed" }))
            ngx.exit(401)
        end

        if not res.id_token then
            ngx.status = 401
            ngx.say(cjson.encode({ error = "Unauthorized" }))
            ngx.exit(401)
        end

        if res.id_token.iss ~= tenant_config.auth.oidc_issuer
            and res.id_token.iss ~= tenant_config.auth.oidc_issuer .. "/" then
            ngx.status = 401
            ngx.say(cjson.encode({ error = "Invalid token issuer" }))
            ngx.exit(401)
        end

        if res.id_token.aud ~= tenant_config.auth.oidc_client_id then
            ngx.status = 401
            ngx.say(cjson.encode({ error = "Invalid token audience" }))
            ngx.exit(401)
        end

        ngx.req.set_header("X-Auth-User-Id", res.id_token.sub)
        if res.user and res.user.email then
            ngx.req.set_header("X-Auth-Email", res.user.email)
        end

        -- === Bước 3: Tenant resolution ===
        local doc_type = ngx.var.doc_type
        local doc_location = ngx.var.doc_location

        local tenant_key = "tenant:" .. host
        local tenant_id = ngx.shared.tenant:get(tenant_key)
        if not tenant_id then
            local httpc = http.new()
            local ok, _ = httpc:connect("unix:/var/run/axum")
            if ok then
                local res2, _ = httpc:request({
                    path = "/api/admin/v1/tenant/" .. host .. "/id",
                    method = "GET",
                    headers = {
                        ["Host"] = host,
                        ["Connection"] = "Keep-Alive",
                    }
                })
                if res2 and res2.status == 200 then
                    tenant_id = res2:read_body()
                    ngx.shared.tenant:set(tenant_key, tenant_id, 600)
                end
                httpc:set_keepalive()
            end
        end
        ngx.req.set_header("X-Tenant-Id", tenant_id or "")

        if doc_type == "1" then
            ngx.var.dynamic_path = "/docs/" .. doc_location .. "/openapi.json"
        else
            ngx.log(ngx.ERR, "Not found correct doc location " .. doc_location .. "(" .. doc_type .. ")" .. " for oidc " .. oidc_name)

            if tenant_id then
                ngx.var.dynamic_path = "/api/admin/v1/files" .. ngx.var.request_uri
            else
                ngx.exit(404)
            end
        end
    }

    add_header X-Oidc-Name "$oidc_name" always;
    add_header X-Doc-Type "$doc_type" always;
    add_header X-Jwt-Required "$jwt_required" always;
    add_header X-Request-Method "$request_method" always;
    add_header X-Request-URI "$request_uri" always;

    proxy_pass http://backend$dynamic_path;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    proxy_cache WEBSITE;
    proxy_cache_valid 200 1h;
    add_header X-Cache-Status $upstream_cache_status;
}
