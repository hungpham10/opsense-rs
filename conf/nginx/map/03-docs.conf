
# Ánh xạ host+oidc_name → loại tài liệu (doc_type)
# 0 = không có docs, 1 = có docs
# Key = $host$oidc_name để hỗ trợ nhiều OIDC provider trên cùng host
map $host$oidc_name $doc_type {
    default                         0;
    localhostdefault                1;
    lighttrading.pp.uadefault       1;
    findaily.vnopenapi              1;
    findaily.vnllm                  1;
}

# Ánh xạ host+oidc_name → vị trí tài liệu (doc_location)
# Dùng để chọn đúng OpenAPI spec (admin / investing / ...)
map $host$oidc_name $doc_location {
    localhostdefault                admin;
    lighttrading.pp.uadefault       investing;
    findaily.vnopenapi              investing;
    findaily.vnllm                  chat;
    default                         "";
}
