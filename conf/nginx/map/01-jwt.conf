# ── 01-jwt.conf ─────────────────────────────────────────────────────────────
# Auth flow mapping.
#
# ── Auth Groups ──────────────────────────────────────────────────────────
#
#   GROUP A — Internal / Backend  (Auth0 M2M / JWKS)
#     Dev workflows, gold.py pipeline, admin panel, chat AI.
#     Auth via Auth0 client_credentials → Bearer token → JWKS verify.
#
#   GROUP B — Public / Client     (Supabase / HS256)  ◆ TODO(phase-b)
#     3rd-party gold shops pushing prices, external devs.
#     Auth via Supabase JWT → HS256 shared secret verify.
#
#   GROUP C — Unauthenticated
#     Public reads, webhooks, health checks. No auth required.
#
# ── Maps ──────────────────────────────────────────────────────────────────
#
#   $jwt_required  → 0=public, 1=force JWT, 2=require auth (no token=401)
#   $oidc_name     → Auth config to load from Axum auth-config endpoint.
#                     "default" = Dex/JWKS (dùng cho mọi route kể cả /api/admin)
#                     (tên khác chỉ dùng được sau khi có dòng sys_oidc tương ứng;
#                      trỏ vào tên không tồn tại ⇒ route chết ở Lua)
#                     (empty)   = skip auth (Group C)
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
#  A. $jwt_required — Mức yêu cầu auth
#
#     Key = $request_method + URI, để phân biệt GET (public) vs POST (auth).
#     Regex patterns không prefix method sẽ match mọi method.
# ─────────────────────────────────────────────────────────────────────────
map $request_method$uri $jwt_required {
    default 2;

    # ── OAuth2 device flow (RFC 8628) — public cho CLI/console ────────
    # device/code, device (HTML form), device/token không yêu cầu Bearer;
    # các endpoint còn lại (device/verify, token/revoke, session/*) vẫn
    # require Bearer (fall through default 2).
    #
    # KHÔNG có `token/refresh`: đã gỡ khỏi server. Xem `api/oauth/v1.rs`.
    ~^POST/api/oauth/v1/device/code          0;
    ~^GET/api/oauth/v1/device                0;
    ~^POST/api/oauth/v1/device/token         0;

    # ── Group A: Internal — yêu cầu auth ────────────────────────────
    # (Investing endpoints removed — chưa cần trong scope opsense-rs hiện tại)
}

# ─────────────────────────────────────────────────────────────────────────
#  B. $oidc_name — Auth config selector
#
#     Mỗi route nhóm theo auth group. Giá trị rỗng = dùng $jwt_required
#     để quyết định (0=cho qua, 1/2=401).
# ─────────────────────────────────────────────────────────────────────────
map $uri $oidc_name {
    default "default";

    # ═══════════════════════════════════════════════════════════════════
    # GROUP A — Internal
    # ═══════════════════════════════════════════════════════════════════
    # KHÔNG gán `oidc_name` riêng cho `/api/admin/*` — nó rơi về `default`
    # (Dex/JWKS) như mọi route khác.
    #
    # Trước đây nó trỏ `"m2m"`, mà `sys_oidc` không có dòng tên đó ⇒
    # `auth-config?name=m2m` trả 500 ⇒ **mọi** request `/api/admin/*` chết ở
    # Lua (`04-api.conf:102`) trước khi chạm handler, kể cả `POST
    # /tokens/users` (phát token cho user) và `DELETE /tokens/users/{id}`.
    # Đo trên stack thật: `?name=default` → 200, `?name=m2m` → 500
    # `Not found host localhost for oidc m2m`.
    #
    # Đây là **cấu hình thiếu**, không phải thiết kế sai: `m2m` được khai để
    # trỏ vào JWKS của một provider M2M (Auth0 v.v.), nơi chính JWKS quyết định
    # token nào được vào. Local chưa có provider đó nên chỉ có `default`.
    # Khi thêm provider, thêm dòng `sys_oidc` tương ứng rồi gán `oidc_name` ở
    # đây — trỏ vào tên không tồn tại thì route chết ngay.
    #
    # ⚠ TRONG KHI CHƯA CÓ `m2m` THẬT: không có kiểm role nào ở tầng app
    # (`grep -rn "X-User-Role" crates/` rỗng — header Nginx set ở
    # `04-api.conf:203` không chỗ nào trong Rust đọc), nên **bất kỳ** user
    # đăng nhập hợp lệ qua Dex cũng gọi được `/api/admin/*`, kể cả phát và thu
    # hồi token của user khác. Ở local một tenant thì chấp nhận được; bật nguyên
    # xi ở multi-tenant thì KHÔNG được. Khi mở rộng: bảng role riêng + kiểm ở
    # handler `issue_user_token`/`revoke_user_token`, KHÔNG đụng `AdminHeaders`
    # (nó áp cho cả `token/introspect`, mà Nginx gọi nội bộ qua UDS không có
    # token user — sửa sai chỗ đó sẽ làm hỏng đường xác thực `abt_`).

    # ═══════════════════════════════════════════════════════════════════
    # Docs routes (dùng default = web browser OIDC redirect)
    # ═══════════════════════════════════════════════════════════════════
    ~^/docs/                             "openapi";
    ~^/api-docs/                         "openapi";
    ~^/swagger/                          "openapi";
    ~^/apidocs/                          "openapi";
    ~^/swagger-ui/                       "openapi";
}

# ─────────────────────────────────────────────────────────────────────────
#  C. $connection_upgrade — WebSocket upgrade header
# ─────────────────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
