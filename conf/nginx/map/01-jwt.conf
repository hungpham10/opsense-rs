# ── 01-jwt.conf ─────────────────────────────────────────────────────────────
# Auth flow mapping.
#
# ── Auth Groups ──────────────────────────────────────────────────────────
#
#   GROUP A — Internal / Backend  (Auth0 M2M / JWKS)
#     Dev workflows, gold.py pipeline, admin panel, chat AI.
#     Auth via Auth0 client_credentials → Bearer token → JWKS verify.
#
#   GROUP B — Public / Client     (Supabase / HS256)  ◆ TODO(phase-b)
#     3rd-party gold shops pushing prices, external devs.
#     Auth via Supabase JWT → HS256 shared secret verify.
#
#   GROUP C — Unauthenticated
#     Public reads, webhooks, health checks. No auth required.
#
# ── Maps ──────────────────────────────────────────────────────────────────
#
#   $jwt_required  → 0=public, 1=force JWT, 2=require auth (no token=401)
#   $oidc_name     → Auth config to load from Axum auth-config endpoint.
#                     "m2m"     = Auth0 JWKS (Group A)
#                     "default" = Supabase HS256 (Group B)
#                     (empty)   = skip auth (Group C)
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
#  A. $jwt_required — Mức yêu cầu auth
#
#     Key = $request_method + URI, để phân biệt GET (public) vs POST (auth).
#     Regex patterns không prefix method sẽ match mọi method.
# ─────────────────────────────────────────────────────────────────────────
map $request_method$uri $jwt_required {
    default 2;

    # ── Group C: No auth ──────────────────────────────────────────────
    # Public GET endpoints
    ~^GET/api/investing/v1/ohcl/             0;
    ~^GET/api/investing/v2/stores            0;   # store listing
    ~^GET/api/investing/v2/prices            0;   # price queries
    ~^GET/ws/investing/v3                    0;

    # Webhooks (always POST, but public)
    ~^POST/api/chat/v1/facebook/webhook      0;
    ~^POST/api/chat/v1/slack/webhook         0;
	~^POST/api/chat/v1/llm/chat/completions  1;
	~^GET/api/chat/v1/llm/models             1;

    # ── Group A: Internal — yêu cầu auth ────────────────────────────
    # POST đến stores (create product, update price) cần auth
    ~^POST/api/investing/v2/stores           2;

    # astra-render GraphQL — luôn cần auth, không redirect OIDC
    ~^POST/api/investing/v2/astra-render     2;
}

# ─────────────────────────────────────────────────────────────────────────
#  B. $oidc_name — Auth config selector
#
#     Mỗi route nhóm theo auth group. Giá trị rỗng = dùng $jwt_required
#     để quyết định (0=cho qua, 1/2=401).
# ─────────────────────────────────────────────────────────────────────────
map $uri $oidc_name {
    default "default";

    # ═══════════════════════════════════════════════════════════════════
    # GROUP A — Internal (Auth0 M2M / JWKS)
    # ═══════════════════════════════════════════════════════════════════
    ~^/api/admin/                        "m2m";
    ~^/api/investing/v2/astra-render     "m2m";
	~^/api/chat/v1/llm/chat/completions  "pat";
	~^/api/chat/v1/llm/models            "pat";

    # ═══════════════════════════════════════════════════════════════════
    # GROUP B — Public (Supabase / HS256)
    # ═══════════════════════════════════════════════════════════════════
    # TODO(phase-b): Kích hoạt khi backend + nginx sẵn sàng xác thực
    # Supabase JWT. Hiện tại v2/stores vẫn dùng Auth0 để không break
    # gold.py (luồng gọi từ Prefect worker cũ — token vẫn verify được
    # dù $jwt_required = 0 nhờ Lua check Authorization header).
    ~^/api/investing/v2/stores            "default";

    # ═══════════════════════════════════════════════════════════════════
    # Docs routes (dùng default = web browser OIDC redirect)
    # ═══════════════════════════════════════════════════════════════════
    ~^/docs/                             "openapi";
    ~^/api-docs/                         "openapi";
    ~^/swagger/                          "openapi";
    ~^/apidocs/                          "openapi";
    ~^/swagger-ui/                       "openapi";
}

# ─────────────────────────────────────────────────────────────────────────
#  C. $connection_upgrade — WebSocket upgrade header
# ─────────────────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
