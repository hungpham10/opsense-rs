server {
    server_name %%HTTP_SERVER%% %%TOR_SERVER%%;
    listen 8080 reuseport;

    set_by_lua_block $environment {
        return os.getenv("ENVIRONMENT") or "prod"
    }

    if ($is_attack = "1") {
	return 403;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 10s;

    root /var/www/html;
    index index.html index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Chặn method lạ (WebDAV: PROPFIND/MKCOL/COPY…, TRACE, CONNECT).
    #
    # `TRACE` là vector tấn công thật (XST), `CONNECT` để lật đường hầm, WebDAV
    # không dùng ở đây — nên danh sách này phải còn.
    #
    # `DELETE` và `OPTIONS` **phải** nằm trong danh sách:
    #   - `DELETE` cho `DELETE /api/admin/v1/tokens/users/{id}` (thu hồi token).
    #     Thiếu nó thì route chết ở tầng nginx, không bao giờ tới app — đo được
    #     trên stack thật: 405 với `Content-Type: text/html` và thân là trang 405
    #     mặc định của openresty (khác hẳn 405 của axum, vốn không có body).
    #   - `OPTIONS` cho CORS preflight. Thiếu nó thì khối
    #     `if ($request_method = 'OPTIONS') return 204` trong `vhost/04-api.conf`
    #     thành **code chết** (if ở tầng server chạy trước) và trình duyệt không
    #     gọi được API chéo domain — đo: OPTIONS kèm `Origin` +
    #     `Access-Control-Request-Method` → 405.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|HEAD|OPTIONS|DELETE)$) {
        return 405;
    }

    error_page 404 @handle_404;
    proxy_intercept_errors on;

    # 404 thật.
    #
    # `error_page` ở trên trỏ tới named location này từ lâu, nhưng **handler
    # chưa có trong conf** — nên khi nginx không tìm thấy named location được
    # trỏ tới, nó tự trả **500** thay vì 404. Đo được trên stack v1.0.17:
    # `/health` → 200 nhưng `/khong-ton-tai` → **500**, và thân 500 là trang mặc
    # định của openresty (không phải JSON của app).
    #
    # Hệ quả nếu để nguyên: **mọi** 404 đều thành 500, tức không phân biệt được
    # "sai URL" với "server chết". Với gossip còn nặng hơn: peer gọi
    # `/health/live` mà nhận 500 thì bị coi là node chết — đúng thứ phân biệt mà
    # module đó sinh ra để làm.
    #
    # Khi bổ sung handler đầy đủ (lấy trang 404 từ S3 qua
    # `GET /api/admin/v1/files/...` — xem `vhost/03-openbb.conf:43` và
    # `fetch_file` trong `crates/opsense/src/api/admin/v1.rs`) thì **chỉ thay
    # phần bên trong**, giữ `return` để status vẫn là 404.
    location @handle_404 {
        default_type text/html;
        return 404 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>404 Not Found</title></head><body><h1>404 Not Found</h1></body></html>';
    }

    include http.d/vhost/*.conf;
}
