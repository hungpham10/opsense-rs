# Opsense integration test — pipeline đọc Prometheus (thực) → lưu parquet lên S3 (MinIO).
# Chạy: `docker compose up -d prometheus node-exporter metrics-adapter minio minio-bucket opsense-serve opsense-runner opsense-runner-python`
# Xem docs/KUBERNETES.md §5.1.3 cho config reference đầy đủ.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

# Storage = Parquet time-partitioned → mirror S3 (MinIO).
# Sau khi flush, file ts/blk=<id>/batch-*.parquet xuất hiện ở
# s3://opsense-lake/integration-test/<id>/ts/** — Spark/DuckDB/Polars đọc thẳng.
[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300
# parquet_compression = "zstd"

[storage.s3]
bucket = "opsense-lake"
prefix = "integration-test"
endpoint = "http://minio:9000"
url_style = "path"
s3_flush_interval_secs = 15
s3_snapshot_interval_secs = 60

# Capacity cho các metric.
[capacity]
up = 1.0
node_cpu_seconds_total = 4.0
node_memory_MemAvailable_bytes = 16.0

# Pipeline: clock → http_source (poll metrics-adapter → real Prometheus data)
# → timeseries_station_sink (ghi vào station, persistence ở [storage]).
[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "http_source"
id = "prom-metrics"
inputs = ["clock"]
url = "http://metrics-adapter:8080/metrics"
interval_secs = 10
timeout_secs = 10
station = true

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["prom-metrics"]
