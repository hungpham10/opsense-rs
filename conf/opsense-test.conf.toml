# Opsense integration test — pipeline clock → parquet → S3 (RustFS).
# Chạy: `make test-storage-prometheus-up`.

[engine]
poll_interval_seconds = 10

# Storage = Parquet time-partitioned → mirror S3 (RustFS).
# Sau khi flush, file ts/blk=<id>/batch-*.parquet xuất hiện ở
# s3://opsense-lake/integration-test/<id>/ts/** — Spark/DuckDB/Polars đọc thẳng.
[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300
# s3_flush_interval_secs / s3_snapshot_interval_secs là lịch sync của
# [storage] (KHÔNG nằm trong [storage.s3] — config cũ để lệch schema thì bị
# serde bỏ qua âm thầm, flush rơi về default 60s/600s).
s3_flush_interval_secs = 15
s3_snapshot_interval_secs = 60

[storage.s3]
bucket = "opsense-lake"
prefix = "integration-test"
endpoint = "http://rustfs:9000"
url_style = "path"

# Pipeline: clock → timeseries_station_sink (ghi vào station, persistence ở [storage]).
[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["clock"]
