# Opsense configuration.
# See docs/PLAN.MD for the field reference.

[engine]
poll_interval_seconds = 60
cache_block_seconds = 300
cache_max_blocks = 288

# Minimal pipeline: clock source → timeseries station sink. Required so the
# bare `opsense serve` container (which mounts this file) has an explicit
# `[pipeline]` instead of relying on the in-code default. Override or
# extend this section to wire real sources/sinks for your environment.
# Storage for the sink comes from `[storage]` below (default backend:
# memory). Integration tests exercise non-default storage via
# strategies/<name>/config.toml.
[pipeline]
[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 60

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["clock"]

# Vector/Alloy metrics source. Disabled by default in dev — there is no
# Vector service in the docker-compose stack. Uncomment the block below
# and point `url` at a real scrape endpoint to enable metric ingestion.
#
# [sources.vector]
# url = "http://alloy:9080"
# jq_filter is run through opsense_mlib::jq::JsonQuery, which supports field
# access (`.field`), array iteration (`[]`) and field selection
# (`select(a, b, ...)`). It does NOT support `|` pipes or `{...}` object
# literals, so the upstream MUST already emit observation-shaped objects, e.g.
#   [{"ts": 1, "metric_id": "cpu_usage", "kind": "metric", "signal": "raw",
#     "value": 12.5, "labels": {"instance": "a"}}]
# This filter simply iterates an array under `.data`.
# jq_filter = ".data[]"
# metrics = ["cpu_usage", "mem_usage"]
