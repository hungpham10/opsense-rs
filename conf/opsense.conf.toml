# Opsense configuration.
# See docs/PLAN.MD for the field reference.
#
# Đây là config **tối giản**: chạy được ngay ở mức đơn giản nhất, để xám
# `opsense serve` có chạy không và MCP/GraphQL có sống không. Không có ví dụ
# cụ thể nào ở đây — *vận hành cái gì* là tuỳ người dùng, nên thêm
# source/sink thật vào `[pipeline]` bên dưới.

[engine]
poll_interval_seconds = 60

# Pipeline tối giản: nhịp thời gian → in ra stdout.
#
# Cố ý **không** dùng `timeseries_station_sink`: `clock` chỉ phát tick điều
# khiển, không mang observation, nên station sinh ra sẽ **luôn rỗng** mà vẫn tốn
# một vòng ghi. Muốn có station thì thêm node `station = true` kèm component
# thật sự ghi vào nó.
[pipeline]
[[pipeline.components]]
type = "clock"
id = "clock"
# `description` là metadata cho MCP/GraphQL: nói node này chứa dữ liệu gì.
# KHÔNG phải field của component — mọi component struct có
# `#[serde(deny_unknown_fields)]` nên key này phải được bóc ra trước khi
# deserialize (xem `node_descriptions` trong crates/opsense/src/api/mod.rs).
description = "Chỉ nhịp thời gian. **Tick là control signal, không mang observation**."
interval_secs = 60

[[pipeline.components]]
type = "print"
id = "print"
description = "In từng message ra stdout. Không giữ state, không cần station."
inputs = ["clock"]

# ── Module động nạp lúc boot ────────────────────────────────────────────────
# Repl/GraphQL là register_builtin hardcode trong serve.rs, KHÔNG điều khiển
# bằng config — đừng khai chúng ở đây.
#
# [[modules]]
# id = "xt-pnl"          # `[a-zA-Z0-9_-]`, cùng lúc là tên symbol `opsense_module_<id>_init`
# path = "modules/xt-pnl.so"   # tuyệt đối (bắt đầu bằng `/`) hoặc tương đối thư mục này
# enabled = true         # mặc định true
