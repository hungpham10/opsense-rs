[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Allow release.yml to be hand-edited (we append the codesign + cosign jobs
# after the generated `host` job). Without this, cargo-dist aborts the release
# because the committed release.yml no longer matches its generated output.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"

# The installers to generate for each app
installers = []

# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Where to host releases
hosting = "github"

# System dependencies that cargo-dist must install on each CI runner *before*
# building. opsense-proto's build script compiles .proto files with protoc
# (via tonic-prost-build), and protoc is not vendored by any crate.
[dist.dependencies.apt]
protobuf-compiler = '*'

[dist.dependencies.homebrew]
protobuf = '*'

[dist.dependencies.chocolatey]
protoc = '*'
