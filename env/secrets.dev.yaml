# Plaintext secrets for dev — encrypt with sops before committing.
# Usage:
#   sops --age <recipient> -e secrets.dev.yaml > secrets.dev.enc.yaml
# The .enc.yaml files are what get mounted into the opsense-serve container.
# release.sh decrypts secrets.{APP_ENV}.enc.yaml at boot and exports the
# values as environment variables (POSTGRES_HOST, DB_DSN, ...).

POSTGRES_HOST: postgres
POSTGRES_PORT: "5432"
POSTGRES_USER: opsense
POSTGRES_PASSWORD: opsense123
POSTGRES_DATABASE: opsense
DB_DSN: postgres://opsense:opsense123@postgres:5432/opsense

# Vector/Alloy is disabled by default in dev. Uncomment the line below and
# the matching url in conf/opsense.conf.toml to enable.
# VECTOR_URL: http://alloy:9080
