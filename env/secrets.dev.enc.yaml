# Placeholder — NOT a real SOPS file.
#
# docker-compose.yml bind-mounts ./env/secrets.dev.enc.yaml into the container.
# Docker auto-creates missing bind-mount sources as DIRECTORIES, which would
# make the mount target a directory instead of a file.
#
# Nothing decrypts this file unless SOPS_AGE_KEY_CONTENT is set, and
# docker-compose.yml does not set it — release.sh:13-16 returns early with
# "Ignore decryption". To use real secrets, replace this with a
# `sops -e` output and export SOPS_AGE_KEY_CONTENT (see `make encrypt`).
