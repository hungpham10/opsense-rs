# Parquet + S3 (MinIO) — prediction system: clock → 2 HTTP sources (window
# history + live) → rhai predict (predict.rhai) → tsdb.
#
# Pipeline graph:
#   clock ──┬── window-feed (http_source, station=true)  lịch sử 60s của metric
#           ├── live-feed   (http_source, station=true)  realtime sample
#           └── predict     (rhai_transform)             chỉ nhận clock ping
#
# `predict` KHÔNG nhận message từ 2 http source — mỗi ping clock nó tự query các
# station qua native `station_query(station, from, to)` (xem
# crates/opsense-rhai/src/station.rs):
#   1. window = station_query("window-feed", now-600, now) → AnalysisGrid +
#      TransitionAnalysis → prediction (`labels.check = "prediction"`)
#   2. live = station_query("live-feed", now-600, now) → so với prediction cũ
#      (đọc từ station của chính nó) → check (`labels.check = "result"`,
#      value 1.0/0.0) → tsdb.
#
# Dữ liệu thật từ https://prometheus.demo.prometheus.io — demo trả Prometheus
# JSON (không phải observations array) nên source log-warn bình thường khi dùng
# demo; e2e test re-point `url` về mock deterministic.
# Sau khi flush, file ts/blk=<id>/batch-*.parquet ở
# s3://opsense-lake/test-case-predict/tsdb/ts/**.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300
# s3_flush_interval_secs / s3_snapshot_interval_secs là lịch sync của
# [storage] (KHÔNG nằm trong [storage.s3] — config cũ để lệch schema nên
# bị serde bỏ qua âm thầm, flush rơi về default 60s/600s).
s3_flush_interval_secs = 15
s3_snapshot_interval_secs = 60
# parquet_compression = "zstd"

[storage.s3]
bucket = "opsense-lake"
prefix = "test-case-predict"
endpoint = "http://minio:9000"
url_style = "path"
# Creds/region KHÔNG khai ở đây — fallback theo env `OPSENSE_S3_*` rồi `AWS_*`
# (xem opsense-core station.rs open_backend).

[capacity]
cpu_ramp = 100.0
cpu_steady = 100.0

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "http_source"
id = "window-feed"
inputs = ["clock"]
# Endpoint demo Prometheus — khi dùng demo thì parse log-warn (body là
# Prometheus JSON); e2e test re-point url này về mock observations array.
url = "https://prometheus.demo.prometheus.io/api/v1/query_range?query=cpu"
interval_secs = 10
timeout_secs = 5
station = true

[[pipeline.components]]
type = "http_source"
id = "live-feed"
inputs = ["clock"]
url = "https://prometheus.demo.prometheus.io/api/v1/query?query=cpu"
interval_secs = 10
timeout_secs = 5
station = true

[[pipeline.components]]
type = "rhai_transform"
id = "predict"
inputs = ["clock"]  # ping kích hoạt; mọi dữ liệu lấy qua station_query
script_path = "strategies/predict/predict.rhai"

   # Tên các station script query — source lịch sử, source realtime, và
   # station của chính node này (để đọc prediction của tick trước).
   [pipeline.components.params]
   window_source = "window-feed"
   live_source = "live-feed"
   own_station = "predict"
   tolerance = 1.0

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["predict"]  # predictions + checks → tsdb → parquet → S3