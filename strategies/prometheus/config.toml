# Parquet + S3 (MinIO) — full Prometheus demo → clock → station → S3.
# Dữ liệu thật: up{job="prometheus"}, up{job="node"},
# node_cpu_seconds_total{mode="idle"}, node_memory_MemAvailable_bytes
# (từ https://prometheus.demo.prometheus.io).
# Sau khi flush, file ts/blk=<id>/batch-*.parquet ở
# s3://opsense-lake/test-case-prom/<id>/ts/**.

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300
# parquet_compression = "zstd"

[storage.s3]
bucket = "opsense-lake"
prefix = "test-case-prom"
endpoint = "http://minio:9000"
url_style = "path"
s3_flush_interval_secs = 15
s3_snapshot_interval_secs = 60

[capacity]
up = 1.0
node_cpu_seconds_total = 4.0
node_memory_MemAvailable_bytes = 16.0

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["clock"]

