# Local parquet storage — không S3.
# Pipeline: clock → timeseries_station_sink (station lưu vào local parquet).

[engine]
poll_interval_seconds = 10

[storage]
backend = "parquet"
data_dir = "/app/.opsense/parquet"
block_secs = 5
retention_secs = 300

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["clock"]