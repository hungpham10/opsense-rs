# Memory storage — thuần RAM, không persistence.
# Pipeline: clock → timeseries_station_sink (station lưu trong memory).

[engine]
poll_interval_seconds = 10

[storage]
backend = "memory"

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
inputs = ["clock"]