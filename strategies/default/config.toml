# Default storage — không khai báo `[storage]` nên rơi về backend `memory`.
#
# Đây là **fixture cho matrix leg `default`** của CI: storage integration test
# cần một station thật để ghi rồi đọc lại qua GraphQL (`queryTimeseries`), nên
# pipeline ở đây phải có `timeseries_station_sink`.
#
# Cố ý TÁCH khỏi `conf/opsense.conf.toml`: file đó là config tối giản để
# `opsense serve` chạy được (clock → print), dùng cho môi trường đơn giản và
# làm người đọc mới không tưởng opsense là công cụ trading. Test thì cần
# pipeline có station, nên CI copy file này đè lên `conf/opsense.conf.toml`
# trước khi `docker compose up` — xem `.github/workflows/ci.yml`.

[engine]
poll_interval_seconds = 60

[pipeline]
[[pipeline.components]]
type = "clock"
id = "clock"
# `description` là metadata cho MCP/GraphQL: nói node này chứa dữ liệu gì.
# KHÔNG phải field của component — mọi component struct có
# `#[serde(deny_unknown_fields)]` nên key này phải được bóc ra trước khi
# deserialize (xem `node_descriptions` trong crates/opsense/src/api/mod.rs).
description = "Chỉ nhịp thời gian. **Tick là control signal, không mang observation** — station `tsdb` nối từ đây vì vậy không bao giờ có dữ liệu."
interval_secs = 60

[[pipeline.components]]
type = "timeseries_station_sink"
id = "tsdb"
description = "Ghi observation từ message vào station `tsdb`. Với nguồn là `clock` thì không gì được ghi — xem mô tả node `clock`."
inputs = ["clock"]
