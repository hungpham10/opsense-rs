# Binance grid — realtime ticks (aggTrade qua websocket) + kline history (HTTP)
# → snapshot grid-transition (AnalysisGrid + TransitionAnalysis).
#
# Pipeline graph:
#   clock ─────────┐
#                  ├──→ grid (rhai_transform, inputs = ["clock", "history", "tick-map"])
#   history ───────┘   (http_source, station=true, candles mode — Binance klines)
#   tick-feed ───────────────────────────────────┐
#                                              (websocket_2_json → json_2_json:
#                                               map `E`→ts (ms), `s`→metric_id,
#                                               `p`→value cast f64 + constants
#                                               trigger/kind/signal/labels)
#   tick-map ───────┐
#                   ├──→ grid
#   binance-tsdb ←──┘   (timeseries_station_sink — terminal, memory-only)
#
# `grid` branch theo `trigger()` (ưu tiên `payload.trigger`, fallback
# `payload.src` — xem crates/opsense-rhai/src/transform.rs):
#   - trigger == "tick"   → gộp trade price vào candle hiện tại (bucket theo
#     resolution) trong station của chính node → OHLCV obs ra own station.
#   - trigger khác (clock ping ""/`history`) → merge history candles + candle
#     live → `grid_fit` + `transition_analysis` → summary obs
#     (`labels.kind = "snapshot"`).
#
# Storage memory-only — v1 runtime-only, chưa persist (tsdb sink là node
# terminal giữ graph hợp lệ, dữ liệu nằm trong RAM).
#
# Note: http interval không điều khiển tần suất fetch — nhịp do clock; và
# `history` source có `station = true` nên terminal (không cần consumer).

[engine]
poll_interval_seconds = 10
cache_block_seconds = 5
cache_max_blocks = 12

[storage]
backend = "memory"

[capacity]
btcusdt = 100000.0

[[pipeline.components]]
type = "clock"
id = "clock"
interval_secs = 10

[[pipeline.components]]
type = "http_source"
id = "history"
inputs = ["clock"]
url = "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=500"
interval_secs = 10
timeout_secs = 5
station = true

   [pipeline.components.candles]
   symbol = "BTCUSDT"
   resolution = "1m"
   unit_ms = 1
   # mapping mặc định = Binance klines layout: [].0..[].5

[[pipeline.components]]
type = "websocket_2_json"
id = "tick-feed"
uri = "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"

[[pipeline.components]]
type = "json_2_json"
id = "tick-map"
inputs = ["tick-feed"]

   [pipeline.components.constants]
   kind = "metric"
   signal = "raw"
   trigger = "tick"

   [pipeline.components.constants.labels]
   resolution = "1m"

   [pipeline.components.transforms.ts]
   query = "E"

   [pipeline.components.transforms.metric_id]
   query = "s"

   [pipeline.components.transforms.value]
   query = "p"
   cast_to = "f64"

[[pipeline.components]]
type = "rhai_transform"
id = "grid"
inputs = ["clock", "history", "tick-map"]
script_path = "strategies/binance/grid.rhai"

   [pipeline.components.params]
   history_source = "history"
   own_station = "grid"
   symbol = "BTCUSDT"
   resolution = "1m"
   history_secs = 3600
   live_window_secs = 300

   # mode = "analysis" (mặc định) — chỉ dựng grid + transition, phát snapshot.
   # mode = "trading" — thêm bước đặt lệnh: candle đã đóng chạy qua kernel
   # `portfolio_feed` (cùng kernel backtest dùng), lệnh ghi thành observation
   # `signal = "order"` trong station `grid` (open/close theo `labels.status`).
   # Các tham số dưới là tham số engine cho nhánh đó — đổi ở đây, không sửa script.
   mode = "analysis"
   calendar = "crypto"
   strategy = "grid"
   grid_levels = 5
   sl_pct = 0.008
   smoothing_k = 10.0
   lookback_secs = 172800
   review_interval_secs = 900
   trading_candle_secs = 60
   fee_rate = 0.0005
   kelly_fraction = 0.25
   base_capital = 100000.0
   # T+N — 0 = theo thị trường (crypto T+0). Ví dụ 1 = chỉ đóng lệnh từ nến kế tiếp.
   settlement_candles = 0

# Terminal node (bắt buộc: transform non-sink phải có consumer). Chỉ giữ
# snapshots + candles trong memory — không persist / không MinIO (v1).
[[pipeline.components]]
type = "timeseries_station_sink"
id = "binance-tsdb"
inputs = ["grid"]